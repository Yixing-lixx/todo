<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A46A4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="任务本">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="format-detection" content="telephone=no, date=no, email=no, address=no">
<title>日程任务本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* planner paper, blue-black ink, a highlighter for "now" and ad-hoc work */
  --bg:#ECEEE9; --surface:#FBFCFA; --ink:#17201C; --muted:#5F6964; --line:#D5DAD3;
  --accent:#2A46A4; --accent-ink:#FFFFFF; --accent-soft:#E1E6F5;
  --hi:#F2D159; --hi-ink:#362C00;
  --ok:#2B8250; --ok-soft:#DCEEE3; --warn:#B4740B; --warn-soft:#F7EBD2; --bad:#B9402F; --bad-soft:#F5DFDB;
  --font-display:"Bricolage Grotesque","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(20,32,26,.06),0 6px 18px rgba(20,32,26,.06);
  /* layout: one planner column; time rail on the left of each task; add bar pinned to the bottom; editors rise as sheets */
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1311; --surface:#171C1A; --ink:#E3E9E5; --muted:#949F99; --line:#2A322E;
    --accent:#93A9F3; --accent-ink:#0D1530; --accent-soft:#1F2846;
    --hi:#D8B843; --hi-ink:#1C1500;
    --ok:#5CC28A; --ok-soft:#163023; --warn:#E2A33B; --warn-soft:#342711; --bad:#EE7666; --bad-soft:#3A1E1A;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.28);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1311; --surface:#171C1A; --ink:#E3E9E5; --muted:#949F99; --line:#2A322E;
  --accent:#93A9F3; --accent-ink:#0D1530; --accent-soft:#1F2846;
  --hi:#D8B843; --hi-ink:#1C1500;
  --ok:#5CC28A; --ok-soft:#163023; --warn:#E2A33B; --warn-soft:#342711; --bad:#EE7666; --bad-soft:#3A1E1A;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.28);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
button:disabled{opacity:.45;cursor:default}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h2,h3{text-wrap:balance}
.wrap{max-width:720px;margin:0 auto;padding:env(safe-area-inset-top) max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
.auth{margin-top:8px;gap:14px}.auth h2{margin:0;font-size:18px}.auth form{display:grid;gap:10px}.auth .row{display:flex;gap:8px}
button.sync{border-radius:99px;padding:4px 6px}
.top{display:flex;align-items:center;gap:10px;padding:14px 0 6px}
.brand{font-family:var(--font-display);font-weight:700;font-size:18px;display:flex;align-items:center;gap:9px}
.logo{width:20px;height:20px;border-radius:5px;background:var(--accent);position:relative;flex:none}
.logo::after{content:"";position:absolute;left:4px;right:4px;top:9px;height:4px;border-radius:2px;background:var(--hi)}
.sync{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.ok::before{background:var(--ok)}.sync.local::before{background:var(--warn)}.sync.err::before{background:var(--bad)}
.icon{width:36px;height:36px;display:inline-grid;place-items:center;border-radius:10px;color:var(--muted);flex:none}
.icon:hover{background:var(--accent-soft);color:var(--ink)}
.icon svg{width:20px;height:20px}
.tabs{position:sticky;top:0;z-index:6;background:var(--bg);display:flex;gap:4px;padding:6px 0 10px}
.tabs button{flex:1;text-align:center;padding:9px 0;border-radius:10px;color:var(--muted);font-weight:600;font-size:14px;border:1px solid transparent}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);border-color:var(--line);box-shadow:var(--shadow)}
main{padding-bottom:40px}
main.pad-lg{padding-bottom:150px}
main.pad-xl{padding-bottom:215px}
.t-timer{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--accent);background:var(--accent-soft)}
.t-timer svg{width:16px;height:16px}
.t-timer.on{background:var(--bad);color:#fff}
.tag.timing{background:var(--bad-soft);color:var(--bad);border-color:transparent;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.task.is-timing{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.task.is-timing,.task.is-timing.is-now{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.task.is-timing .t-rail,.task.is-timing.is-now .t-rail{background:var(--bad)}
.timerbar{position:fixed;left:12px;right:12px;z-index:21;max-width:696px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:9px 9px 9px 14px;border-radius:14px;background:var(--ink);color:var(--bg);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.tb-dot{width:8px;height:8px;border-radius:50%;background:var(--bad);flex:none;animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.timerbar .tb-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;text-align:left}
.tb-c{font-family:var(--font-mono);font-weight:600;font-variant-numeric:tabular-nums;font-size:15px}
.timerbar .tb-b{padding:7px 11px;border-radius:9px;font-size:13px;font-weight:700;background:color-mix(in srgb,var(--bg) 18%,transparent);color:var(--bg);flex:none}
.timerbar .tb-b.fin{background:var(--hi);color:var(--hi-ink)}
body.timing .toast{bottom:calc(178px + env(safe-area-inset-bottom))}
.loading{padding:60px 0;text-align:center;color:var(--muted)}

/* head card */
.dayhead{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);display:grid;gap:12px}
.dh-row{display:flex;align-items:center;gap:6px}
.dh-title{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.dh-num{font-family:var(--font-display);font-weight:700;font-size:38px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.dh-lab{display:grid;line-height:1.3;min-width:0}
.dh-lab b{font-size:15px}.dh-lab span{font-size:12.5px;color:var(--muted)}
.meter{display:grid;gap:7px}
.meter-nums{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.meter-nums b{color:var(--ink);font-family:var(--font-mono);font-weight:600}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.b-ok{background:var(--ok)}.b-warn{background:var(--warn)}
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wcell{display:grid;justify-items:center;gap:3px;padding:6px 0 7px;border-radius:10px;font-size:11px;color:var(--muted);border:1px solid transparent;text-align:center}
.wcell b{font-family:var(--font-mono);font-size:14px;color:var(--ink);font-weight:500}
.wcell.on{background:var(--accent);color:var(--accent-ink)}.wcell.on b{color:var(--accent-ink)}
.wcell.today:not(.on){border-color:var(--accent)}
.mini{width:70%;height:3px;border-radius:9px;background:var(--line);overflow:hidden;display:block}
.mini i{display:block;height:100%;background:var(--ok)}
.wcell.on .mini{background:color-mix(in srgb,var(--accent-ink) 30%,transparent)}.wcell.on .mini i{background:var(--accent-ink)}
.sdot{width:5px;height:5px;border-radius:50%;display:block}
.sdot.y{background:var(--hi)}

/* toolbar, banners */
.toolbar,.selbar{display:flex;gap:8px;margin:14px 0 4px;overflow-x:auto;scrollbar-width:none;align-items:center}
.toolbar::-webkit-scrollbar{display:none}
.tb{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:600;white-space:nowrap}
.tb svg{width:16px;height:16px}
.tb.accent{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.selbar{flex-wrap:wrap}
.selbar b{font-size:14px}
.sp{flex:1}
.banner{display:flex;align-items:center;gap:10px;margin:12px 0 0;padding:10px 12px;border-radius:12px;background:var(--hi);color:var(--hi-ink);font-size:13.5px}
.banner button{margin-left:auto;font-weight:700;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.tip{font-size:12.5px;color:var(--muted);margin:4px 2px}
.tip.warn{color:var(--warn)}

/* timeline */
.sec-h{display:flex;align-items:center;gap:8px;margin:20px 2px 8px;font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:600}
.sec-h::after{content:"";flex:1;height:1px;background:var(--line)}
.list{display:grid;gap:6px}
.task{display:grid;grid-template-columns:46px 3px 30px minmax(0,1fr) 34px 30px;align-items:center;gap:0 9px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px 8px 10px;min-height:58px}
.t-time{font-family:var(--font-mono);font-size:12.5px;display:grid;line-height:1.3;font-variant-numeric:tabular-nums}
.t-time b{font-weight:600}.t-time span{color:var(--muted)}
.t-time{cursor:pointer}
.t-time,.dh-lab,.wcell,.dr-num,.sr-time,.pv-when{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.t-rail{align-self:stretch;border-radius:3px;background:var(--line)}
.t-check{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;background:var(--surface)}
.t-check svg{width:15px;height:15px}
.t-check:hover{border-color:var(--ok)}
.t-check.sq{border-radius:7px}
.t-check.sq[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.st-done .t-check{background:var(--ok);border-color:var(--ok);color:#fff}
.st-partial .t-check{border-color:var(--warn);background:linear-gradient(90deg,var(--warn) 50%,var(--surface) 50%)}
.st-skipped .t-check{border-style:dashed}
.selmode .t-check{background:var(--surface);color:transparent;border-style:solid}
.t-main{min-width:0;display:grid;gap:3px;padding:3px 0;width:100%}
.t-title{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.t-out{font-size:12.5px;color:var(--ink);opacity:.8;overflow-wrap:anywhere;padding-left:8px;border-left:2px solid var(--hi)}
.sr-out{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.st-done .t-title,.st-skipped .t-title{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.t-meta{display:flex;flex-wrap:wrap;gap:4px 6px;font-size:12px;color:var(--muted);align-items:center}
.dur{font-family:var(--font-mono);font-size:11.5px;padding:1px 6px;border-radius:6px;background:var(--bg);color:var(--ink)}
.tag{padding:0 6px;border-radius:6px;font-size:11.5px;line-height:18px;border:1px solid var(--line)}
.tag.adhoc{background:var(--hi);color:var(--hi-ink);border-color:transparent}
.tag.goal{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.tag.goal::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;border:1.5px solid currentColor;margin-right:4px;vertical-align:1px}
.tag.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.tag.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.tag.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.tag.now{color:var(--accent);border-color:var(--accent)}
.tag.focus{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.t-more{width:30px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.t-more svg{width:18px;height:18px}
.st-done .t-rail{background:var(--ok)}.st-partial .t-rail{background:var(--warn)}
.st-skipped .t-rail{background:repeating-linear-gradient(180deg,var(--muted) 0 3px,transparent 3px 6px)}
.task.is-now{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.task.is-now .t-rail{background:var(--accent)}
.task.is-ov .t-rail{background:repeating-linear-gradient(180deg,var(--bad) 0 4px,transparent 4px 7px)}
.task.is-sel{background:var(--accent-soft);border-color:var(--accent)}
.gap{display:flex;align-items:center;gap:6px;width:100%;padding:4px 10px 4px 14px;min-height:30px;border:1px dashed var(--line);border-radius:10px;font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.gap svg{width:14px;height:14px}
.gap:hover{border-color:var(--accent);color:var(--accent)}
.nowline{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:11.5px;font-weight:600;color:var(--hi-ink);margin:2px 0}
.nowline span{background:var(--hi);padding:1px 7px;border-radius:6px}
.nowline::after{content:"";flex:1;height:2px;background:var(--hi);border-radius:2px}
.moved{font-size:13px;color:var(--muted);display:grid;gap:4px;padding:10px 12px;border:1px dashed var(--line);border-radius:12px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:18px;display:grid;gap:12px;margin-top:14px}
.empty h3{margin:0;font-size:16px}
.empty p{margin:0;color:var(--muted);font-size:13.5px;max-width:58ch}
.empty .tb{justify-self:start}

/* week */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 12px;box-shadow:var(--shadow)}
.muted-card{padding:12px 14px;color:var(--muted);font-size:13.5px;box-shadow:none}
.goal{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.goal:first-child{border-top:0}
.goal.done .t-check{background:var(--ok);border-color:var(--ok);color:#fff}
.goal.done .t-title{color:var(--muted);text-decoration:line-through}
.g-main{display:grid;gap:3px;min-width:0}
.prog{display:inline-flex;gap:2px;margin-left:4px;vertical-align:middle}
.prog i{width:10px;height:6px;border-radius:2px;background:var(--line)}
.prog i.f{background:var(--ok)}.prog i.p{background:var(--warn)}
.mini-btn{padding:6px 10px;border-radius:9px;border:1px solid var(--line);font-size:12.5px;font-weight:600;background:var(--surface);white-space:nowrap}
.mini-btn:hover{border-color:var(--accent);color:var(--accent)}
.dayrow{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;align-items:center;gap:10px;padding:10px 10px 10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer}
.dayrow.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.dr-d{display:grid;line-height:1.15;font-size:11.5px;color:var(--muted);text-align:center}
.dr-d b{font-family:var(--font-display);font-size:21px;color:var(--ink)}
.dr-mid{display:grid;gap:6px;min-width:0}
.dr-titles{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dr-titles .dn{color:var(--muted);text-decoration:line-through}
.faint{color:var(--muted)}
.load{height:4px;border-radius:9px;background:var(--bg);overflow:hidden;display:block}
.load i{display:block;height:100%;background:var(--accent);opacity:.7}
.dr-num{font-family:var(--font-mono);font-size:13px;display:grid;justify-items:end;line-height:1.25}
.dr-num small{font-size:11px;color:var(--muted)}
.sumdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--hi);margin-left:4px;vertical-align:1px}
.blrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.hbar{display:grid;grid-template-columns:minmax(80px,9em) 1fr 26px;gap:10px;align-items:center;font-size:13px;padding:7px 0}
.hbar .tr{height:8px;background:var(--bg);border-radius:9px;overflow:hidden;display:block}
.hbar .tr i{display:block;height:100%;background:var(--warn);border-radius:9px}
.hbar b{font-family:var(--font-mono);font-weight:600;text-align:right}

/* review */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:2px}
.kpi b{font-family:var(--font-display);font-size:24px;font-variant-numeric:tabular-nums}
.kpi b small{font-size:13px;color:var(--muted)}
.kpi span{font-size:12px;color:var(--muted)}
@media (max-width:520px){.kpis{grid-template-columns:repeat(2,1fr)}}
.chartwrap{position:relative;padding:12px 30px 8px 0}
.chart{display:grid;grid-template-columns:repeat(14,1fr);gap:5px;align-items:end;height:130px;border-bottom:1px solid var(--line);background:linear-gradient(var(--line) 1px,transparent 1px) 0 0/100% 50%}
.chart .col{height:100%;display:flex;align-items:flex-end}
.chart .col i{display:block;width:100%;border-radius:4px 4px 0 0;background:color-mix(in srgb,var(--accent) 45%,transparent)}
.chart .col.last i{background:var(--accent)}
.chart .col i.none{height:2px;background:var(--line);border-radius:2px}
.yl{position:absolute;right:0;font-family:var(--font-mono);font-size:10.5px;color:var(--muted);transform:translateY(-50%)}
.chart-x{display:grid;grid-template-columns:repeat(14,1fr);gap:5px;font-family:var(--font-mono);font-size:10.5px;color:var(--muted);text-align:center;padding:4px 30px 0 0}
.chart-x .last{color:var(--accent);font-weight:600}
.hrow{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;width:100%}
.h-top{font-size:13px;font-family:var(--font-mono)}

/* add bar */
.addbar,.selaction{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:16px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 72%,transparent)}
.addbar-in{max-width:720px;margin:0 auto;display:grid;gap:6px}
.hint{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding:0 4px;min-height:24px;overflow:hidden}
.scope{flex:none;padding:3px 9px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--ink)}
.pk{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pk b{color:var(--accent)}
.addrow{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:var(--shadow)}
.addrow:focus-within{border-color:var(--accent)}
.addrow input{flex:1;min-width:0;border:0;background:transparent;padding:9px 4px;outline:none}
.mic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.mic svg{width:20px;height:20px}
.mic.sm{width:38px;height:38px;border-radius:10px}
.mic.nomic{background:var(--bg);color:var(--muted)}
.mic.rec{background:var(--bad);color:#fff;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 45%,transparent)}50%{box-shadow:0 0 0 7px transparent}}
.send{width:42px;height:42px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.send svg{width:20px;height:20px}

/* sheets */
.backdrop{position:fixed;inset:0;background:rgba(8,12,10,.42);z-index:40;opacity:0;transition:opacity .18s}
.backdrop.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92%;display:flex;flex-direction:column;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.2);transform:translateY(100%);transition:transform .22s ease,opacity .18s;max-width:720px;margin:0 auto}
.sheet.show{transform:none}
@media (min-width:760px){
  .sheet{top:50%;bottom:auto;border-radius:20px;opacity:0;transform:translateY(-46%);max-height:88%;max-width:600px}
  .sheet.show{opacity:1;transform:translateY(-50%)}
}
.sh-head{display:flex;align-items:center;gap:8px;padding:14px 12px 10px 18px;border-bottom:1px solid var(--line)}
.sh-head h2{font-size:17px;margin:0;flex:1;min-width:0;overflow-wrap:anywhere}
.sh-body{overflow:auto;padding:16px 18px;display:grid;gap:16px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sh-foot{padding:10px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:8px}
.field{display:grid;gap:7px}
.field>label,.lab{font-size:12.5px;font-weight:600;color:var(--muted)}
.inp{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);outline:none;min-width:0}
.inp:focus{border-color:var(--accent);background:var(--surface)}
textarea.inp{resize:vertical;line-height:1.5}
.withmic{display:flex;gap:6px;align-items:flex-start}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 11px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13px;line-height:1.35}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.ghost{border-style:dashed;color:var(--muted)}
.seg{display:flex;background:var(--bg);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;text-align:center;padding:8px 6px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg button.ok[aria-pressed="true"]{background:var(--ok);color:#fff}
.seg button.warn[aria-pressed="true"]{background:var(--warn);color:#fff}
.seg button.bad[aria-pressed="true"]{background:var(--bad);color:#fff}
.durn{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.durn .inp{width:80px;padding:5px 8px;border-radius:99px;text-align:center}
.btn{flex:1;text-align:center;padding:12px;border-radius:12px;font-weight:700;background:var(--bg);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);flex:0 0 auto;padding:12px 18px}
.selaction .btn{width:100%;box-shadow:var(--shadow)}
.preview{border:1px dashed var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:6px;font-size:13px}
.pv-h{font-weight:600;color:var(--muted);font-size:12.5px}
.pv-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:baseline}
.pv-t{overflow-wrap:anywhere}
.pv-when{font-family:var(--font-mono);font-size:12px;white-space:nowrap;display:flex;gap:6px;align-items:baseline}
.pv-from{color:var(--muted);text-decoration:line-through}
.pv-to{color:var(--accent);font-weight:600}
.pv-to.over{color:var(--warn)}
.pitem{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px;background:var(--bg)}
.pitem .inp{background:var(--surface)}
.pi-top{display:flex;gap:6px;align-items:center}
.mini-f{display:grid;gap:4px;font-size:11.5px;color:var(--muted);min-width:0}
.mini-f .inp{padding:8px;font-size:15px}
.seg.sm button{padding:6px;font-size:13px}
.menu{display:grid;gap:2px;margin:-6px -8px}
.menu button{padding:13px 10px;border-radius:10px;font-size:15px}
.menu button:hover{background:var(--bg)}
.menu .danger{color:var(--bad)}
.stepper{display:flex;align-items:center;gap:14px}
.stepper b{font-family:var(--font-mono);font-size:18px;min-width:4em;text-align:center}
.stepper .icon{border:1px solid var(--line);font-size:20px;color:var(--ink)}
.sumhead{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sumhead div{background:var(--bg);border-radius:12px;padding:10px;display:grid;justify-items:center}
.sumhead b{font-family:var(--font-display);font-size:22px;font-variant-numeric:tabular-nums}
.sumhead span{font-size:12px;color:var(--muted)}
.srow{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:9px}
.sr-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:baseline}
.sr-time{font-family:var(--font-mono);font-size:12.5px;color:var(--muted)}
.sr-title{font-weight:600;overflow-wrap:anywhere}
.sr-sub{font-size:12px;color:var(--muted);font-weight:600}
.inline-add{display:flex;gap:6px}
.dataline{font-size:13px;color:var(--muted)}
.rmx{margin-left:4px;opacity:.6}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(112px + env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;z-index:60;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:13.5px;display:flex;gap:14px;align-items:center;width:max-content;max-width:calc(100% - 32px);transition:opacity .2s,transform .2s;pointer-events:none;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--hi);font-weight:700;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*,.sheet,.backdrop,.toast{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="logo" aria-hidden="true"></span>日程任务本</div>
    <button class="sync" id="sync" data-act="sync-now" aria-live="polite">启动中</button>
    <button class="icon" data-act="settings" aria-label="设置" id="btnSettings"></button>
  </header>
  <nav class="tabs" role="tablist" aria-label="视图">
    <button role="tab" data-tab="day" aria-selected="true">日计划</button>
    <button role="tab" data-tab="week" aria-selected="false">周计划</button>
    <button role="tab" data-tab="review" aria-selected="false">回顾</button>
  </nav>
  <main id="view"></main>
</div>
<div class="addbar" id="addbar">
  <div class="addbar-in">
    <div class="hint" id="hint"></div>
    <form class="addrow" id="addForm" autocomplete="off">
      <button type="button" class="mic" data-act="mic" data-mic="#addInput" aria-label="语音输入" id="addMic"></button>
      <input id="addInput" type="text" enterkeyhint="done" placeholder="说或写：明天上午9点 组会 1小时" aria-label="添加任务">
      <button type="submit" class="send" aria-label="添加" id="addSend"></button>
    </form>
  </div>
</div>
<div class="selaction" id="selaction" hidden></div>
<div class="timerbar" id="timerbar" role="status" hidden></div>
<div id="sheet-root"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script id="core">
/* ===== pure logic: dates, parsing, scheduling ===== */
const pad=n=>String(n).padStart(2,'0');
function ds(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function pd(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function addDays(s,n){const d=pd(s);d.setDate(d.getDate()+n);return ds(d);}
function dow(s){const g=pd(s).getDay();return g===0?7:g;}
function monday(s){return addDays(s,1-dow(s));}
function diffDays(a,b){return Math.round((pd(b)-pd(a))/86400000);}
function isoWeek(s){const t=addDays(s,4-dow(s));const y0=`${t.slice(0,4)}-01-01`;return Math.floor(diffDays(y0,t)/7)+1;}
const WD=['','周一','周二','周三','周四','周五','周六','周日'];
function fmtHM(m){if(m==null)return '—';m=Math.max(0,Math.min(1440,Math.round(m)));if(m===1440)return '24:00';return pad(Math.floor(m/60))+':'+pad(m%60);}
function parseHM(s){const m=/^(\d{1,2}):(\d{2})/.exec(s||'');if(!m)return null;return (+m[1])*60+(+m[2]);}
function fmtDur(m){m=Math.round(m||0);const h=Math.floor(m/60),r=m%60;if(!h)return r+'m';return h+'h'+(r?pad(r):'');}
function fmtHours(m){const h=Math.round((m||0)/6)/10;return h+'h';}
function mdLabel(s){const d=pd(s);return `${d.getMonth()+1}月${d.getDate()}日`;}
function mdShort(s){if(s==='backlog')return '';const d=pd(s);return `${d.getMonth()+1}/${d.getDate()}`;}
function relLabel(d,td){if(d==='backlog')return '待安排';const n=diffDays(td,d);const M={0:'今天',1:'明天',2:'后天','-1':'昨天','-2':'前天'};if(M[n]!=null)return M[n];return n>0?`${n}天后`:`${-n}天前`;}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
const isActive=t=>t.status!=='done'&&t.status!=='skipped';
function byStart(a,b){return (a.start??1e9)-(b.start??1e9)||(a.created||0)-(b.created||0);}
function stats(list){let n=0,done=0,part=0,skip=0,plan=0,doneMin=0,adhoc=0,score=0;
  for(const t of list){n++;const d=t.dur||0;plan+=d;
    if(t.status==='done'){done++;doneMin+=t.actual!=null?t.actual:d;score+=1;}
    else if(t.status==='partial'){part++;const p=(t.pct||50)/100;doneMin+=t.actual!=null?t.actual:d*p;score+=p;}
    else if(t.status==='skipped')skip++;
    if(t.adhoc)adhoc++;}
  return {n,done,part,skip,plan,doneMin:Math.round(doneMin),adhoc,rate:n?score/n:0};}
function overlaps(dayList,start,dur,exceptId){return dayList.filter(t=>t.id!==exceptId&&t.start!=null&&isActive(t)&&t.start<start+dur&&t.start+(t.dur||0)>start);}

/* --- Chinese natural-language parsing --- */
const NUM_SRC='\\d+(?:\\.\\d+)?|[零〇一二两俩三四五六七八九十百]+';
const CNMAP={'零':0,'〇':0,'一':1,'二':2,'两':2,'俩':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
function cnNum(s){if(s==null)return NaN;if(/^\d+(\.\d+)?$/.test(s))return parseFloat(s);
  let total=0,cur=0,any=false;
  for(const ch of s){if(ch==='十'){total+=(cur||1)*10;cur=0;any=true;}else if(ch==='百'){total+=(cur||1)*100;cur=0;any=true;}else if(ch in CNMAP){cur=CNMAP[ch];any=true;}else return NaN;}
  return any?total+cur:NaN;}
function normalize(s){return String(s||'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/：/g,':').replace(/[－—–～~]/g,'-').replace(/\s+/g,' ').trim();}
const GOAL_RE=/(下周|下星期|本周|这周|这星期)\s*的?\s*(?:目标|任务)|周目标|周任务/;
const DUR_RE=new RegExp(`(${NUM_SRC})\\s*个?\\s*(半)?\\s*(?:小时|钟头|hours?|hrs?|h(?![a-z]))(?:\\s*(${NUM_SRC})\\s*分钟?)?|(半)\\s*个?\\s*(?:小时|钟头)|(${NUM_SRC})\\s*(?:分钟|minutes?|mins?(?![a-z]))|(${NUM_SRC})?\\s*刻钟`,'i');
const REL_RE=/(大后天|后天|明天|明日|明早|明晚|今天|今日|今晚|今早)/;
const REL={'今天':[0],'今日':[0],'今晚':[0,'晚'],'今早':[0,'早'],'明天':[1],'明日':[1],'明早':[1,'早'],'明晚':[1,'晚'],'后天':[2],'大后天':[3]};
const WK_RE=/(下下|下个?|这个?|本|上个?)?\s*(?:周|星期|礼拜)\s*([一二三四五六日天1-7])/;
const MD_RE=new RegExp(`(${NUM_SRC})\\s*月\\s*(${NUM_SRC})\\s*[日号]?`);
const DH_RE=new RegExp(`(${NUM_SRC})\\s*号`);
const PER_SRC='凌晨|早上|早晨|上午|中午|下午|傍晚|晚上|夜里|夜间|早|晚';
const TIME_RE=new RegExp(`(${PER_SRC})?\\s*(?:(\\d{1,2}):(\\d{2})|(${NUM_SRC})\\s*[点时]钟?\\s*(?:(半)|(一刻)|(三刻)|(\\d{2})(?!\\d)\\s*分?|(\\d{1,2})\\s*分|([零一二两三四五六七八九十]+)\\s*分)?)`,'g');
const PER_DEFAULT={'早上':480,'早晨':480,'上午':540,'中午':720,'下午':840,'傍晚':1050,'晚上':1170};
function adjHour(h,per,hint){const p=per||hint;
  if(!p)return (h>=1&&h<=6)?h+12:h;
  if(/凌晨|早|上午/.test(p))return h===12?0:h;
  if(/中午/.test(p))return h<=3?h+12:h;
  if(h===12)return 24;
  return h<12?h+12:h;}
function parseOne(raw,ctx){
  let s=' '+normalize(raw)+' ';
  const r={title:'',kind:null,day:null,start:null,dur:null,goalWeek:null,hint:null,output:null};
  const take=(re,fn)=>{const m=re.exec(s);if(!m)return false;if(fn(m)===false)return false;s=s.slice(0,m.index)+' '+s.slice(m.index+m[0].length);return true;};
  const validDay=d=>ds(pd(d))===d;
  take(/(?:产出|交付物|交付|输出)\s*(?:是|为)?\s*[:：]?\s*(.+)$/,m=>{const o=m[1].trim();if(!o)return false;r.output=o;});
  take(GOAL_RE,m=>{r.kind='goal';r.goalWeek=(m[1]&&/下/.test(m[1]))?addDays(monday(ctx.today),7):(ctx.goalWeek||monday(ctx.today));});
  take(DUR_RE,m=>{let v=null;
    if(m[1]!=null){const h=cnNum(m[1]);if(isNaN(h))return false;v=h*60+(m[2]?30:0);if(m[3]!=null){const mm=cnNum(m[3]);if(!isNaN(mm))v+=mm;}}
    else if(m[4])v=30;
    else if(m[5]!=null)v=cnNum(m[5]);
    else{const k=m[6]!=null?cnNum(m[6]):1;v=(isNaN(k)?1:k)*15;}
    if(!v||isNaN(v)||v<=0||v>1440)return false;r.dur=Math.round(v);});
  take(REL_RE,m=>{const [o,h]=REL[m[1]];r.day=addDays(ctx.today,o);if(h)r.hint=h;});
  if(!r.day)take(MD_RE,m=>{const mo=cnNum(m[1]),dd=cnNum(m[2]);if(!(mo>=1&&mo<=12&&dd>=1&&dd<=31))return false;
    const y=+ctx.today.slice(0,4);let d=`${y}-${pad(mo)}-${pad(dd)}`;if(!validDay(d))return false;
    if(diffDays(ctx.today,d)<-60)d=`${y+1}-${pad(mo)}-${pad(dd)}`;r.day=d;});
  if(!r.day)take(WK_RE,m=>{const p=m[1]||'';const map={'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'日':7,'天':7};const n=map[m[2]]||+m[2];if(!(n>=1&&n<=7))return false;
    const off=/下下/.test(p)?14:/下/.test(p)?7:/上/.test(p)?-7:0;let d=addDays(monday(ctx.today),off+n-1);if(!p&&d<ctx.today)d=addDays(d,7);r.day=d;});
  if(!r.day)take(DH_RE,m=>{const dd=cnNum(m[1]);if(!(dd>=1&&dd<=31))return false;const t=pd(ctx.today);
    let d=`${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(dd)}`;
    if(!validDay(d)||d<ctx.today){const n=new Date(t.getFullYear(),t.getMonth()+1,1);d=`${n.getFullYear()}-${pad(n.getMonth()+1)}-${pad(dd)}`;if(!validDay(d))return false;}
    r.day=d;});
  const toks=[];TIME_RE.lastIndex=0;let m;
  while((m=TIME_RE.exec(s))){
    let h,mi=0;const per=m[1]||null;
    if(m[2]!=null){h=+m[2];mi=+m[3];}
    else{h=cnNum(m[4]);
      if(m[5])mi=30;else if(m[6])mi=15;else if(m[7])mi=45;else if(m[8])mi=+m[8];else if(m[9])mi=+m[9];else if(m[10])mi=cnNum(m[10]);
      if(m[4]==='一'&&mi===0&&!m[5]&&(per==='早'||per==='晚'||(!per&&/[快慢多少好大小有再高低轻重差]\s*$/.test(s.slice(0,m.index)))))continue;}
    if(isNaN(h)||h>24||isNaN(mi)||mi>59)continue;
    toks.push({i:m.index,len:m[0].length,h,mi,per});}
  if(toks.length){
    const a=toks[0];let b=null;
    if(toks[1]){const between=s.slice(a.i+a.len,toks[1].i);if(/^\s*(?:到|至|-)\s*$/.test(between))b=toks[1];}
    r.start=Math.min(adjHour(a.h,a.per,r.hint)*60+a.mi,1439);
    let cutEnd=a.i+a.len;
    if(b){let e=adjHour(b.h,b.per||a.per,r.hint)*60+b.mi;if(e<=r.start&&e+720>r.start)e+=720;if(e>r.start)r.dur=Math.min(e,1440)-r.start;cutEnd=b.i+b.len;}
    s=s.slice(0,a.i)+' '+s.slice(cutEnd);}
  if(r.start==null){
    const pm=/(早上|早晨|上午|中午|下午|傍晚|晚上)/.exec(s);
    if(pm){r.start=PER_DEFAULT[pm[1]];r.approx=true;s=s.slice(0,pm.index)+' '+s.slice(pm.index+pm[0].length);}
    else if(r.hint){r.start=r.hint==='早'?480:1170;r.approx=true;}}
  let t=s.replace(/左右|大约|大概/g,' ').replace(/\s+/g,' ').trim();
  t=t.replace(/^(?:(?:从|在|于|要|得|去|先|再|花|用|约|共|的|是)(?=\s)|[，,、。.:：\-\s]|我需要|我要|我得|我想|需要|然后|接着|用时|耗时)+/,'');
  t=t.replace(/(?:[，,、。.:：\-\s]|一下|吧|啊|呢|用时|时长|左右)+$/,'').replace(/\s+的$/,'');
  t=t.replace(/([一-鿿])\s+(?=[一-鿿])/g,'$1').trim();
  r.title=t;
  return r;}
function parseInput(text,ctx){
  const parts=normalize(text).split(/[。；;！!？?\n]+|[，,]|\s*(?:然后|接着|随后|再然后|还有|另外|以及)\s*/).map(x=>(x||'').trim()).filter(Boolean);
  const out=[];let pend=null;const KEYS=['day','start','dur','kind','goalWeek','approx','output'];
  for(const p of parts){
    const r=parseOne(p,ctx);
    if(!r.title){
      const outOnly=r.output!=null&&r.dur==null&&r.day==null&&r.start==null&&r.kind==null;
      if(outOnly&&out.length&&!out[out.length-1].output){out[out.length-1].output=r.output;continue;}
      const durOnly=r.dur!=null&&r.day==null&&r.start==null&&r.kind==null;
      if(durOnly&&out.length&&out[out.length-1].dur==null){out[out.length-1].dur=r.dur;}
      else{pend=pend||{};for(const k of KEYS)if(r[k]!=null&&pend[k]==null)pend[k]=r[k];}
      continue;}
    if(pend){for(const k of KEYS)if(r[k]==null&&pend[k]!=null)r[k]=pend[k];pend=null;}
    out.push(r);}
  if(pend&&out.length){const last=out[out.length-1];for(const k of KEYS)if(last[k]==null&&pend[k]!=null)last[k]=pend[k];}
  const res=[];let prev=null;
  for(const it of out){
    if(prev){
      if(it.kind==null&&prev.kind==='goal'&&it.day==null&&it.start==null){it.kind='goal';it.goalWeek=prev.goalWeek;}
      if(it.kind!=='goal'&&it.day==null&&prev.kind!=='goal'&&prev.daySet)it.day=prev.day;}
    const kind=it.kind||((it.day!=null||it.start!=null)?'task':ctx.defKind||'task');
    const durSet=it.dur!=null;const dur=it.dur||ctx.defDur||60;
    let day,start=null;
    if(kind==='goal'){day=it.goalWeek||ctx.goalWeek||monday(ctx.today);}
    else{day=it.day||ctx.defDay||ctx.today;start=it.start;
      if(start==null&&prev&&prev.kind==='task'&&prev.start!=null&&prev.day===day)start=prev.start+prev.dur;
      if(day==='backlog'&&start!=null)day=ctx.today;
      if(start!=null&&start>1439)start=null;}
    const item={title:it.title,kind,day,start,dur,durSet,daySet:it.day!=null,approx:!!it.approx,output:it.output||''};
    res.push(item);prev=item;}
  return res;}

/* --- scheduling plans: each returns [{id,title,fromDay,fromStart,day,start,over}] --- */
function resolveOver(t,start){if(start+(t.dur||0)>1440)return {day:addDays(t.day,1),start:null,over:true};return {day:t.day,start,over:false};}
function planInsert(dayList,nt){
  const T=nt.start;if(T==null)return [];
  const mov=dayList.filter(t=>t.id!==nt.id&&t.start!=null&&isActive(t)&&t.start>=T).sort(byStart);
  let cur=T+(nt.dur||0);const out=[];
  for(const t of mov){
    if(t.start<cur){out.push({id:t.id,title:t.title,fromDay:t.day,fromStart:t.start,...resolveOver(t,cur)});cur+=t.dur||0;}
    else cur=Math.max(cur,t.start+(t.dur||0));}
  return out;}
function planShiftTime(dayList,selIds,delta,ripple){
  const sel=new Set(selIds);const timed=dayList.filter(t=>t.start!=null);const ns=new Map();
  for(const t of timed)if(sel.has(t.id))ns.set(t.id,t.start+delta);
  if(ripple&&ns.size){
    const minS=Math.min(...timed.filter(t=>sel.has(t.id)).map(t=>t.start));
    const pool=timed.filter(t=>sel.has(t.id)||(isActive(t)&&t.start>=minS))
      .map(t=>({t,s:ns.has(t.id)?ns.get(t.id):t.start,sel:sel.has(t.id)?1:0}))
      .sort((a,b)=>a.s-b.s||b.sel-a.sel||a.t.start-b.t.start);
    let cur=-Infinity;
    for(const p of pool){if(p.s<cur)p.s=cur;cur=Math.max(cur,p.s+(p.t.dur||0));ns.set(p.t.id,p.s);}}
  const out=[];
  for(const t of timed.slice().sort(byStart)){if(!ns.has(t.id))continue;const s=ns.get(t.id);if(s===t.start)continue;
    out.push({id:t.id,title:t.title,fromDay:t.day,fromStart:t.start,...resolveOver(t,s)});}
  return out;}
function planMoveDate(selTasks,target,timeMode,targetList,dayStart){
  const ids=new Set(selTasks.map(t=>t.id));let cur=null;
  if(target!=='backlog'&&timeMode==='append'){
    const ends=targetList.filter(t=>!ids.has(t.id)&&t.start!=null&&t.status!=='skipped').map(t=>t.start+(t.dur||0));
    cur=Math.max(dayStart,...ends);}
  const out=[];
  for(const t of selTasks){
    let start;
    if(target==='backlog'||timeMode==='none')start=null;
    else if(timeMode==='append'){start=cur;cur+=t.dur||0;}
    else start=t.start;
    let over=false;if(start!=null&&start+(t.dur||0)>1440){start=null;over=true;}
    if(target===t.day&&start===t.start)continue;
    out.push({id:t.id,title:t.title,fromDay:t.day,fromStart:t.start,day:target,start,over});}
  return out;}
function addWorkdays(d,n){let k=n;while(k>0){d=addDays(d,1);if(dow(d)<=5)k--;}return d;}
function planShiftDays(all,selIds,n,skipWE,later){
  const sel=new Set(selIds);
  const selTasks=all.filter(t=>sel.has(t.id)&&t.kind!=='goal'&&t.day!=='backlog');
  if(!selTasks.length||n<=0)return [];
  const from=selTasks.map(t=>t.day).sort()[0];
  const set=new Map(selTasks.map(t=>[t.id,t]));
  if(later)for(const t of all)if(t.kind!=='goal'&&t.day!=='backlog'&&t.day>from&&isActive(t))set.set(t.id,t);
  return [...set.values()].sort((a,b)=>(a.day<b.day?-1:a.day>b.day?1:0)||byStart(a,b))
    .map(t=>({id:t.id,title:t.title,fromDay:t.day,fromStart:t.start,day:skipWE?addWorkdays(t.day,n):addDays(t.day,n),start:t.start,over:false}));}
function planAdd(existing,items,ripple,mk){
  const work=new Map(existing.map(t=>[t.id,{...t}]));const created=[];const changes=new Map();
  const sorted=items.slice().sort((a,b)=>(a.day<b.day?-1:a.day>b.day?1:0)||((a.start??1e9)-(b.start??1e9)));
  for(const it of sorted){
    const t=mk(it);
    if(ripple&&t.kind!=='goal'&&t.start!=null){
      const dayList=[...work.values()].filter(x=>x.kind!=='goal'&&x.day===t.day);
      for(const c of planInsert(dayList,t)){const first=changes.get(c.id);
        changes.set(c.id,{...c,fromDay:first?first.fromDay:c.fromDay,fromStart:first?first.fromStart:c.fromStart});
        work.set(c.id,{...work.get(c.id),day:c.day,start:c.start});}}
    work.set(t.id,t);created.push(t);}
  return {created,changes:[...changes.values()]};}
</script>

  else defDay=S.tab==='week'?((td>=S.week&&td<=addDays(S.week,6))?td:S.week):S.day;
  return {today:td,defDay,defKind,defDur:S.settings.defDur||60,goalWeek};}
function scopeLabel(){const c=addCtx();if(S.scope==='goal')return `第${isoWeek(c.goalWeek)}周目标`;if(S.scope==='backlog')return '待安排';return `${relLabel(c.defDay,c.today)} ${mdShort(c.defDay)}`;}
function describeItem(it){const o=it.output?` · 产出：${esc(it.output)}`:'';if(it.kind==='goal')return `<b>${esc(it.title||'…')}</b> · 第${isoWeek(it.day)}周目标${o}`;
  const p=[it.day==='backlog'?'待安排':`${relLabel(it.day,today())} ${mdShort(it.day)}`,it.start!=null?`${fmtHM(it.start)}–${fmtHM(it.start+it.dur)}${it.approx?'(大约)':''}`:'未定时',fmtDur(it.dur)];
  return `<b>${esc(it.title||'…')}</b> · ${p.join(' · ')}${o}`;}
function updateHint(){const inp=$('#addInput');const v=inp.value.trim();let right='';
  if(v){const items=parseInput(v,addCtx()).filter(x=>x.title);right=items.length>1?`识别到 <b>${items.length}</b> 项，按回车确认`:items.length?describeItem(items[0]):'';}
  else if(Mic.listening&&Mic.btnSel==='#addInput')right='正在听…';
  $('#hint').innerHTML=`<button class="scope" data-act="scope" aria-label="切换添加位置">添加到 ${esc(scopeLabel())} ▾</button><span class="pk">${right}</span>`;}
function autoAdhoc(items){const td=today();if(!items.length||!items.every(x=>x.kind!=='goal'&&x.day===td))return false;
  const l=tasksOfDay(td);if(!l.length)return false;const tl=l.filter(t=>t.start!=null);
  const first=tl.length?Math.min(...tl.map(t=>t.start)):(S.settings.dayStart??540);return nowMin()>first;}
function addItems(items,{ripple=false,adhoc=false}={}){
  const mk=it=>newTask({kind:it.kind,title:it.title,output:(it.output||'').trim(),day:it.day,start:(it.kind==='goal'||it.day==='backlog')?null:it.start,dur:it.dur,adhoc:it.kind!=='goal'&&adhoc,est:it.kind==='goal'&&it.durSet?Math.round(it.dur/6)/10:null});
  const plan=planAdd(allTasks(),items,ripple,mk);
  const snaps=snap(plan.changes.map(c=>c.id));
  plan.created.forEach(t=>Store.saveTask(t));applyChanges(plan.changes);
  return {created:plan.created,changes:plan.changes,snaps};}
function submitAdd(fromVoice){const inp=$('#addInput');const v=inp.value.trim();if(!v)return;
  if(!S.loaded){toast('还在载入，请稍等');return;}
  const items=parseInput(v,addCtx()).filter(x=>x.title);
  if(!items.length){toast('没识别到任务名称，再说具体一点');return;}
  const it=items[0];
  const ov=items.length===1&&it.kind!=='goal'&&it.start!=null&&it.day!=='backlog'&&overlaps(tasksOfDay(it.day),it.start,it.dur).length>0;
  if(fromVoice||items.length>1||ov){openConfirm(items);return;}
  const res=addItems(items,{adhoc:autoAdhoc(items)});
  inp.value='';const t=res.created[0];
  const where=t.kind==='goal'?`第${isoWeek(t.day)}周目标`:t.day==='backlog'?'待安排':`${relLabel(t.day,today())}${t.start!=null?' '+fmtHM(t.start):''}`;
  const away=t.kind!=='goal'&&S.tab==='day'&&t.day!==S.day&&t.day!=='backlog';
  renderAll();
  toast(`已添加到${where}`,away?{label:'去看看',fn:()=>goDay(t.day)}:{label:'撤销',fn:()=>restore([],[t.id])});}
function clearAddInput(){$('#addInput').value='';updateHint();}

/* ---------- voice (browser speech recognition, falls back to keyboard dictation) ---------- */
const Mic={SR:null,sr:null,listening:false,target:null,btnSel:null,base:'',committed:'',
  init(){this.SR=window.SpeechRecognition||window.webkitSpeechRecognition||null;updateMicButtons();},
  click(btn){const sel=btn.dataset.mic;const target=sel?document.querySelector(sel):null;
    if(!this.SR){if(target)target.focus();toast('这个浏览器不支持网页语音：点输入框后用键盘上的麦克风说话，识别照常。',null,7000);return;}
    if(this.listening){try{this.sr.stop();}catch(e){}return;}
    let r;try{r=new this.SR();}catch(e){toast('语音暂时用不了，先打字吧');return;}
    r.lang='zh-CN';r.interimResults=true;r.continuous=false;r.maxAlternatives=1;
    this.sr=r;this.target=target;this.btnSel=sel;this.committed='';this.base=target?target.value:'';
    if(this.base&&!/[\s，,。]$/.test(this.base))this.base+=(target&&target.id==='addInput')?'，':' ';
    r.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const res=e.results[i];if(res.isFinal)this.committed+=res[0].transcript;else interim+=res[0].transcript;}this.put(interim);};
    r.onerror=e=>{const c=e.error;if(c==='not-allowed'||c==='service-not-allowed')toast('没有麦克风或语音识别权限：可以在系统设置里打开，或用键盘自带的语音输入。',null,7000);else if(c!=='no-speech'&&c!=='aborted')toast('语音识别出错（'+c+'），可以再试一次');};
    r.onend=()=>this.onState('idle');
    try{r.start();this.listening=true;}catch(e){toast('语音暂时用不了，先打字吧');return;}
    updateMicButtons();if($('#hint'))updateHint();},
  put(partial){const t=this.target;if(!t)return;t.value=this.base+this.committed+(partial||'');t.dispatchEvent(new Event('input',{bubbles:true}));},
  onState(state){const was=this.listening;this.listening=state!=='idle';updateMicButtons();
    if(was&&!this.listening){const t=this.target,said=this.committed.trim();this.put('');this.target=null;
      if(t&&t.id==='addInput'&&said)setTimeout(()=>submitAdd(true),60);}
    if($('#hint'))updateHint();},
  stopIfIn(root){if(this.listening&&this.target&&root&&root.contains(this.target)){try{this.sr.stop();}catch(e){}}}
};
function updateMicButtons(){document.querySelectorAll('[data-act="mic"]').forEach(b=>{const on=Mic.listening&&b.dataset.mic===Mic.btnSel;
  b.classList.toggle('rec',on);b.classList.toggle('nomic',!Mic.SR);b.setAttribute('aria-label',on?'停止录音':'语音输入');if(!b.innerHTML)b.innerHTML=svg(P.mic);});}
const micBtn=sel=>`<button type="button" class="mic sm" data-act="mic" data-mic="${sel}" aria-label="语音输入">${svg(P.mic)}</button>`;

/* ---------- sheets ---------- */
const Sheet={cur:null,
  open(def){this.close(true);this.cur=def;const root=$('#sheet-root');
    root.innerHTML='<div class="backdrop" data-act="sh-close"></div><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title"></div>';

    document.body.style.overflow='hidden';},

    el.innerHTML=`<div class="sh-head"><h2 id="sh-title">${c.title(c.st)}</h2><button class="icon" data-act="sh-close" aria-label="关闭">${svg(P.close)}</button></div><div class="sh-body">${c.body(c.st)}</div>${c.foot?`<div class="sh-foot">${c.foot(c.st)}</div>`:''}`;
    el.querySelector('.sh-body').scrollTop=sc;updateMicButtons();},
  refresh(){const c=this.cur;if(!c)return;if(c.preview){const p=$('#sh-preview');if(p)p.innerHTML=c.preview(c.st);}const f=$('#sheet .sh-foot');if(f&&c.foot)f.innerHTML=c.foot(c.st);},

  handle(el,e){const act=el.dataset.act;if(act==='sh-close'){this.close();return;}const c=this.cur;if(!c)return;
    const fn=c.on&&c.on[act];if(fn){const r=fn(el,c.st,e);if(r!==false&&this.cur===c)this.render();}}

function durChips(cur,act,list=[15,30,45,60,90,120,180]){return `<div class="chips">${list.map(m=>`<button class="chip" data-act="${act}" data-v="${m}" aria-pressed="${cur===m}">${fmtDur(m)}</button>`).join('')}<label class="durn"><input type="number" inputmode="numeric" min="5" step="5" class="inp" data-k="durN" value="${cur}" aria-label="自定义分钟数"><span>分钟</span></label></div>`;}
function whenLabel(day,start){const dl=day==='backlog'?'待安排':mdShort(day);return start!=null?`${dl} ${fmtHM(start)}`:(day==='backlog'?dl:`${dl} 未定时`);}
function changesHTML(ch,label){if(!ch.length)return '<p class="tip">不需要挪动其他任务。</p>';
  return `<div class="preview"><div class="pv-h">${label} ${ch.length} 项</div>${ch.slice(0,40).map(c=>`<div class="pv-row"><span class="pv-t">${esc(c.title)}</span><span class="pv-when"><span class="pv-from">${whenLabel(c.fromDay,c.fromStart)}</span>→<span class="pv-to${c.over?' over':''}">${whenLabel(c.day,c.start)}${c.over?'（超出当天）':''}</span></span></div>`).join('')}${ch.length>40?`<div class="tip">……另有 ${ch.length-40} 项</div>`:''}</div>`;}

/* confirm parsed items */
function openConfirm(items){
  const st={items:items.map(x=>({...x})),ripple:true,adhoc:autoAdhoc(items)};
  const anyOv=st=>st.items.some(it=>it.title.trim()&&it.kind!=='goal'&&it.start!=null&&it.day!=='backlog'&&overlaps(tasksOfDay(it.day),it.start,it.dur).length);
  const valid=st=>st.items.filter(x=>x.title.trim()).map(x=>({...x,title:x.title.trim(),start:x.day==='backlog'?null:x.start}));
  const preview=st=>{let h='';
    if(anyOv(st)){h+=`<div class="chips"><button class="chip" data-act="cf-ripple" aria-pressed="${st.ripple}">时间冲突时，把后面的任务往后挪</button></div>`;
      if(st.ripple){let k=0;const p=planAdd(allTasks(),valid(st),true,it=>({id:'tmp'+(k++),kind:it.kind,title:it.title,day:it.day,start:it.start,dur:it.dur,status:'todo'}));h+=changesHTML(p.changes,'会顺延');}
      else h+='<p class="tip warn">有任务和已有安排时间重叠。</p>';}
    if(st.items.some(it=>it.kind!=='goal'&&it.day===today()))h+=`<div class="chips"><button class="chip" data-act="cf-adhoc" aria-pressed="${st.adhoc}">标记为临时插入的任务</button></div>`;
    return h;};
  const item=(it,i)=>{const goal=it.kind==='goal';
    return `<div class="pitem"><div class="pi-top"><input class="inp" data-i="${i}" data-k="title" value="${esc(it.title)}" placeholder="任务名称" aria-label="任务名称"><button class="icon" data-act="pi-del" data-i="${i}" aria-label="去掉这一项">${svg(P.close)}</button></div>
      <input class="inp" data-i="${i}" data-k="output" value="${esc(it.output||'')}" placeholder="产出：做完要交出什么（可不填）" aria-label="产出">
      <div class="seg sm"><button data-act="pi-kind" data-i="${i}" data-v="task" aria-pressed="${!goal}">日任务</button><button data-act="pi-kind" data-i="${i}" data-v="goal" aria-pressed="${goal}">周目标</button></div>
      ${goal?`<label class="mini-f"><span>属于哪一周（选这周任意一天）</span><input type="date" class="inp" data-i="${i}" data-k="day" value="${it.day}"></label><p class="tip">第${isoWeek(it.day)}周 · ${mdLabel(it.day)}起</p>`
      :`<div class="grid3"><label class="mini-f"><span>日期</span><input type="date" class="inp" data-i="${i}" data-k="day" value="${it.day==='backlog'?'':it.day}"></label><label class="mini-f"><span>开始</span><input type="time" class="inp" data-i="${i}" data-k="start" value="${it.start!=null?fmtHM(it.start):''}"></label><label class="mini-f"><span>时长</span><select class="inp" data-i="${i}" data-k="dur">${[10,15,20,30,45,60,90,120,150,180,240].concat([it.dur]).filter((v,j,a)=>a.indexOf(v)===j).sort((a,b)=>a-b).map(m=>`<option value="${m}" ${m===it.dur?'selected':''}>${fmtDur(m)}</option>`).join('')}</select></label></div>
        <div class="chips"><button class="chip" data-act="pi-backlog" data-i="${i}" aria-pressed="${it.day==='backlog'}">放进待安排</button>${it.start!=null?`<button class="chip" data-act="pi-notime" data-i="${i}">不定时</button>`:''}</div>`}
    </div>`;};
  Sheet.open({st,
    title:st=>st.items.length>1?`确认添加 ${st.items.length} 项`:'确认添加',
    body:st=>st.items.map(item).join('')+`<div id="sh-preview">${preview(st)}</div>`,
    preview,
    foot:st=>{const n=valid(st).length;return `<button class="btn" data-act="sh-close">取消</button><button class="btn primary" data-act="cf-add" ${n?'':'disabled'}>添加${n>1?` ${n} 项`:''}</button>`;},
    input(el,st){const it=st.items[+el.dataset.i];if(!it)return;const k=el.dataset.k;
      if(k==='title')it.title=el.value;

    on:{
      'pi-kind'(el,st){const it=st.items[+el.dataset.i];it.kind=el.dataset.v;if(it.kind==='goal'){it.day=monday(it.day==='backlog'?today():it.day);it.start=null;}else if(it.day===monday(it.day)&&S.tab==='day')it.day=S.day;},
      'pi-del'(el,st){st.items.splice(+el.dataset.i,1);if(!st.items.length){Sheet.close();return false;}},

    }});
