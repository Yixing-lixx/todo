/* ad-hoc insert */
function openInsert(d){
  const isT=d===today();const nowR=Math.min(1435,Math.ceil(nowMin()/5)*5);
  const timed=()=>tasksOfDay(d).filter(t=>t.start!=null).sort(byStart);
  const firstAct=timed().find(t=>isActive(t)&&(!isT||t.start+(t.dur||0)>nowMin()))||timed()[0];
  const st={title:'',output:'',dur:30,durTouched:false,pos:isT?'now':(firstAct?'after':'time'),after:firstAct?firstAct.id:null,time:isT?nowR:(S.settings.dayStart??540),ripple:true};
  const startOf=st=>{if(st.pos==='now')return nowR;if(st.pos==='after'){const t=S.tasks.get(st.after);return t&&t.start!=null?t.start+(t.dur||0):null;}return st.time;};
  const draft=st=>{const p=st.title.trim()?parseOne(st.title,{today:today()}):null;return {id:'__new',day:d,start:startOf(st),dur:(!st.durTouched&&p&&p.dur)?p.dur:st.dur};};
  const preview=st=>{const dr=draft(st);if(dr.start==null)return '';
    let h=`<p class="tip">将插入 <b>${fmtHM(dr.start)}–${fmtHM(dr.start+dr.dur)}</b>（${fmtDur(dr.dur)}）</p>`;
    if(st.ripple)h+=changesHTML(planInsert(tasksOfDay(d),dr),'会顺延');
    else{const ov=overlaps(tasksOfDay(d),dr.start,dr.dur);if(ov.length)h+=`<p class="tip warn">会和「${esc(ov[0].title)}」时间重叠</p>`;}
    return h;};
  Sheet.open({st,
    title:()=>`临时插入 · ${relLabel(d,today())} ${mdShort(d)}`,
    body:st=>{const tl=timed();
      return `<div class="field"><label for="insTitle">要插入的事</label><div class="withmic"><input id="insTitle" class="inp" data-k="title" value="${esc(st.title)}" placeholder="比如：导师临时找我开会">${micBtn('#insTitle')}</div></div>
      <div class="field"><label for="insOut">产出（做完要交出什么）</label><input id="insOut" class="inp" data-k="output" value="${esc(st.output)}" placeholder="可不填"></div>
      <div class="field"><span class="lab">大概多久</span>${durChips(st.dur,'in-dur',[10,15,20,30,45,60,90,120])}</div>
      <div class="field"><span class="lab">插在什么时候</span><div class="seg">${isT?`<button data-act="in-pos" data-v="now" aria-pressed="${st.pos==='now'}">现在 ${fmtHM(nowR)}</button>`:''}<button data-act="in-pos" data-v="after" aria-pressed="${st.pos==='after'}" ${tl.length?'':'disabled'}>某项之后</button><button data-act="in-pos" data-v="time" aria-pressed="${st.pos==='time'}">指定时间</button></div>
        ${st.pos==='after'?`<select class="inp" data-k="after" aria-label="插在哪一项之后">${tl.map(t=>`<option value="${t.id}" ${t.id===st.after?'selected':''}>${fmtHM(t.start)}–${fmtHM(t.start+(t.dur||0))} ${esc(t.title)}</option>`).join('')}</select>`:''}
        ${st.pos==='time'?`<input type="time" class="inp" data-k="time" value="${fmtHM(st.time)}" aria-label="开始时间">`:''}</div>
      <div class="chips"><button class="chip" data-act="in-ripple" aria-pressed="${st.ripple}">后面没完成的任务依次顺延</button></div>
      <div id="sh-preview">${preview(st)}</div>`;},
    preview,
    foot:()=>'<button class="btn" data-act="sh-close">取消</button><button class="btn primary" data-act="in-ok">插入</button>',
    input(el,st){const k=el.dataset.k;if(k==='title'||k==='output')st[k]=el.value;else if(k==='after')st.after=el.value;
      else if(k==='time'){const v=parseHM(el.value);if(v!=null)st.time=v;}
      else if(k==='durN'){const v=parseInt(el.value,10);if(v>0){st.dur=v;st.durTouched=true;}}},
    on:{
      'in-dur'(el,st){st.dur=+el.dataset.v;st.durTouched=true;},
      'in-pos'(el,st){st.pos=el.dataset.v;if(st.pos==='after'&&!st.after){const t=timed()[0];st.after=t?t.id:null;}},
      'in-ripple'(el,st){st.ripple=!st.ripple;},
      'in-ok'(el,st){let title=st.title.trim();if(!title){toast('先写下要插入的事');$('#insTitle')?.focus();return false;}
        const p=parseOne(title,{today:today()});if(p.title)title=p.title;const dr=draft(st);
        if(dr.start==null){toast('选一下插入的时间');return false;}
        const nt=newTask({title,output:(st.output.trim()||p.output||''),day:d,start:dr.start,dur:dr.dur,adhoc:true});
        const ch=st.ripple?planInsert(tasksOfDay(d),nt):[];const snaps=snap(ch.map(c=>c.id));
        Store.saveTask(nt);applyChanges(ch);Sheet.close();renderAll();
        toast(ch.length?`已插入，后面 ${ch.length} 项已顺延`:'已插入',{label:'撤销',fn:()=>restore(snaps,[nt.id])});return false;}
    }});
  setTimeout(()=>$('#insTitle')?.focus(),260);
}

/* batch shift */
function openShift(ids,mode,opts={}){
  const tasks=ids.map(id=>S.tasks.get(id)).filter(Boolean);if(!tasks.length)return;
  const days=[...new Set(tasks.map(t=>t.day))];
  const canTime=days.length===1&&days[0]!=='backlog'&&tasks.some(t=>t.start!=null);
  const baseDay=days.filter(x=>x!=='backlog').sort()[0]||today();
  const st={ids:tasks.map(t=>t.id),mode:mode||(canTime?'time':'date'),delta:60,ripple:true,target:addDays(baseDay<today()?today():baseDay,1),timeMode:'keep',n:1,skipWE:false,later:!!opts.later,canTime,baseDay};
  if(st.mode==='time'&&!canTime)st.mode='date';
  const plan=st=>{if(st.mode==='time')return planShiftTime(tasksOfDay(st.baseDay),st.ids,st.delta||0,st.ripple);
    if(st.mode==='date'){const sel=st.ids.map(id=>S.tasks.get(id)).filter(Boolean).sort((a,b)=>(a.day<b.day?-1:a.day>b.day?1:0)||byStart(a,b));
      return planMoveDate(sel,st.target,st.timeMode,st.target==='backlog'?[]:tasksOfDay(st.target),S.settings.dayStart??540);}
    return planShiftDays(allTasks(),st.ids,st.n,st.skipWE,st.later);};
  const preview=st=>{let h=changesHTML(plan(st),'将会变动');
    if(st.mode==='time'){const u=st.ids.filter(id=>{const t=S.tasks.get(id);return t&&t.start==null;}).length;if(u)h+=`<p class="tip">另有 ${u} 项没有定时间，不受影响。</p>`;}
    return h;};
  Sheet.open({st,
    title:st=>`后移 ${st.ids.length} 个任务`,
    body:st=>{const td=today();
      let h=`<div class="seg">${[['time','推迟几小时',!st.canTime],['date','改到某天',false],['days','整体顺延几天',false]].map(([v,l,dis])=>`<button data-act="sf-mode" data-v="${v}" aria-pressed="${st.mode===v}" ${dis?'disabled':''}>${l}</button>`).join('')}</div>`;
      if(st.mode==='time'){
        h+=`<div class="field"><span class="lab">往后推多久</span><div class="chips">${[15,30,45,60,90,120,180].map(m=>`<button class="chip" data-act="sf-delta" data-v="${m}" aria-pressed="${st.delta===m}">${m<60?m+' 分钟':(m/60)+' 小时'}</button>`).join('')}<label class="durn"><input type="number" inputmode="numeric" min="5" step="5" class="inp" data-k="delta" value="${st.delta}" aria-label="自定义分钟数"><span>分钟</span></label></div></div>
        <div class="chips"><button class="chip" data-act="sf-ripple" aria-pressed="${st.ripple}">后面没选中的任务如果冲突，也一起往后挪</button></div>`;
      }else if(st.mode==='date'){
        const b=st.baseDay<td?td:st.baseDay;
        const opts=[addDays(b,1),addDays(b,2),addDays(monday(b),7)].filter((v,i,a)=>a.indexOf(v)===i).map(x=>[x,`${relLabel(x,td)} ${mdShort(x)}`]).concat([['backlog','待安排']]);
        h+=`<div class="field"><span class="lab">移到</span><div class="chips">${opts.map(([v,l])=>`<button class="chip" data-act="sf-target" data-v="${v}" aria-pressed="${st.target===v}">${l}</button>`).join('')}</div><input type="date" class="inp" data-k="target" value="${st.target==='backlog'?'':st.target}" aria-label="选择其他日期"></div>`;
        if(st.target!=='backlog')h+=`<div class="field"><span class="lab">时间怎么排</span><div class="seg">${[['keep','保持原时间'],['append','接在那天最后'],['none','先不定时']].map(([v,l])=>`<button data-act="sf-tm" data-v="${v}" aria-pressed="${st.timeMode===v}">${l}</button>`).join('')}</div></div>`;
      }else{
        h+=`<div class="field"><span class="lab">往后顺延</span><div class="stepper"><button class="icon" data-act="sf-n" data-v="-1" aria-label="少一天">−</button><b>${st.n} 天</b><button class="icon" data-act="sf-n" data-v="1" aria-label="多一天">+</button></div></div>
        <div class="chips"><button class="chip" data-act="sf-skipwe" aria-pressed="${st.skipWE}">跳过周末</button><button class="chip" data-act="sf-later" aria-pressed="${st.later}">之后几天没完成的任务也一起顺延</button></div>`;}
      return h+`<div id="sh-preview">${preview(st)}</div>`;},
    preview,
    foot:()=>'<button class="btn" data-act="sh-close">取消</button><button class="btn primary" data-act="sf-ok">确认后移</button>',
    input(el,st){const k=el.dataset.k;if(k==='delta'){const v=parseInt(el.value,10);if(v>0)st.delta=v;}else if(k==='target'){if(el.value)st.target=el.value;}},
    on:{
      'sf-mode'(el,st){st.mode=el.dataset.v;},'sf-delta'(el,st){st.delta=+el.dataset.v;},'sf-ripple'(el,st){st.ripple=!st.ripple;},
      'sf-target'(el,st){st.target=el.dataset.v;},'sf-tm'(el,st){st.timeMode=el.dataset.v;},
      'sf-n'(el,st){st.n=Math.max(1,Math.min(30,st.n+(+el.dataset.v)));},'sf-skipwe'(el,st){st.skipWE=!st.skipWE;},'sf-later'(el,st){st.later=!st.later;},
      'sf-ok'(el,st){const ch=plan(st);if(!ch.length){Sheet.close();return false;}const snaps=snap(ch.map(c=>c.id));applyChanges(ch);S.sel=null;Sheet.close();renderAll();
        const over=ch.filter(c=>c.over).length;
        toast(`已后移 ${ch.length} 项${over?`，其中 ${over} 项排不下，挪到了次日`:''}`,{label:'撤销',fn:()=>restore(snaps)});return false;}
    }});
}

/* task menu */
function openMore(id){const t=S.tasks.get(id);if(!t)return;
  const mv=(ch,msg)=>{const snaps=snap([id]);applyChanges(ch);Sheet.close();renderAll();toast(msg,{label:'撤销',fn:()=>restore(snaps)});};
  Sheet.open({st:{},title:()=>esc(t.title),
    body:()=>`<div class="menu">
      ${t.start!=null&&isActive(t)?'<button data-act="mm-from">从这一项开始，后面的一起后移…</button>':''}
      <button data-act="mm-tomorrow">移到${t.day==='backlog'||t.day<today()?'明天':'后一天'}</button>
      ${t.day!=='backlog'?'<button data-act="mm-backlog">放进待安排</button>':''}
      ${t.status!=='partial'?'<button data-act="mm-partial">标记为部分完成</button>':''}
      ${t.status!=='skipped'?'<button data-act="mm-skip">不做了（放弃）</button>':''}
      ${isActive(t)?`<button data-act="mm-timer">${t.timerStart?'暂停计时':'开始计时'}</button>${t.timerStart||t.tracked?'<button data-act="mm-finish">结束计时并完成</button>':''}`:''}
      <button data-act="mm-edit">编辑详情</button>
      <button data-act="mm-del" class="danger">删除</button></div>`,
    on:{
      'mm-from'(){const ids=tasksOfDay(t.day).filter(x=>x.start!=null&&isActive(x)&&x.start>=t.start).map(x=>x.id);Sheet.close(true);openShift(ids,'time');return false;},
      'mm-tomorrow'(){const base=(t.day==='backlog'||t.day<today())?today():t.day;const d=addDays(base,1);mv([{id,day:d,start:t.start}],`已移到${relLabel(d,today())}`);return false;},
      'mm-backlog'(){mv([{id,day:'backlog',start:null}],'已放进待安排');return false;},
      'mm-partial'(){const snaps=snap([id]);Store.saveTask({...t,status:'partial',pct:t.pct||50});Sheet.close();renderAll();toast('已标记部分完成',{label:'撤销',fn:()=>restore(snaps)});return false;},
      'mm-skip'(){const snaps=snap([id]);Store.saveTask({...t,status:'skipped'});Sheet.close();renderAll();toast('已放弃这项任务',{label:'撤销',fn:()=>restore(snaps)});return false;},
      'mm-timer'(){Sheet.close(true);const c=S.tasks.get(id);if(c&&c.timerStart){pauseTimer(c);renderAll();toast('已暂停计时');}else startTimer(id);return false;},
      'mm-finish'(){Sheet.close(true);finishTimer(id);return false;},
      'mm-edit'(){Sheet.close(true);openEdit(id);return false;},
      'mm-del'(){const snaps=snap([id]);Store.deleteTask(id);Sheet.close();renderAll();toast('已删除',{label:'撤销',fn:()=>restore(snaps)});return false;}
    }});}

/* edit task */
function openEdit(id){const t0=S.tasks.get(id);if(!t0)return;if(t0.kind==='goal')return openGoal(id);
  const st={title:t0.title,output:t0.output||'',day:t0.day,start:t0.start,dur:t0.dur||60,status:t0.status,pct:t0.pct||50,goalId:t0.goalId||null,note:t0.note||'',adhoc:!!t0.adhoc,ripple:false,confirmDel:false,actual:t0.actual??null,ev:t0.ev||null,evNote:t0.evNote||''};
  const preview=st=>{if(!st.ripple||st.start==null||st.day==='backlog')return '';return changesHTML(planInsert(tasksOfDay(st.day).filter(x=>x.id!==id),{id,start:st.start,dur:st.dur}),'会顺延');};
  Sheet.open({st,title:()=>'编辑任务',
    body:st=>{const td=today();const goals=st.day!=='backlog'?goalsOfWeek(monday(st.day)):[];
      return `<div class="field"><label for="edTitle">任务</label><div class="withmic"><input id="edTitle" class="inp" data-k="title" value="${esc(st.title)}">${micBtn('#edTitle')}</div></div>
      <div class="field"><label for="edOut">产出（做完要交出什么）</label><div class="withmic"><input id="edOut" class="inp" data-k="output" value="${esc(st.output)}" placeholder="比如：第三节初稿 1500 字">${micBtn('#edOut')}</div></div>
      <div class="grid2"><div class="field"><label for="edDay">日期</label><input id="edDay" type="date" class="inp" data-k="day" value="${st.day==='backlog'?'':st.day}"></div>
      <div class="field"><label for="edStart">开始时间</label><input id="edStart" type="time" class="inp" data-k="start" value="${st.start!=null?fmtHM(st.start):''}" ${st.day==='backlog'?'disabled':''}></div></div>
      <div class="chips">${[0,1,2].map(n=>{const x=addDays(td,n);return `<button class="chip" data-act="ed-day" data-v="${x}" aria-pressed="${st.day===x}">${relLabel(x,td)}</button>`;}).join('')}<button class="chip" data-act="ed-day" data-v="backlog" aria-pressed="${st.day==='backlog'}">待安排</button>${st.start!=null?'<button class="chip" data-act="ed-notime">不定时</button>':''}</div>
      <div class="field"><span class="lab">大概多久</span>${durChips(st.dur,'ed-dur')}</div>
      <div class="field"><span class="lab">状态</span><div class="seg">${[['todo','待办'],['done','完成'],['partial','部分完成'],['skipped','放弃']].map(([v,l])=>`<button data-act="ed-status" data-v="${v}" aria-pressed="${st.status===v}">${l}</button>`).join('')}</div>
        ${st.status==='partial'?`<div class="chips">${[25,50,75].map(p=>`<button class="chip" data-act="ed-pct" data-v="${p}" aria-pressed="${st.pct===p}">完成约 ${p}%</button>`).join('')}</div>`:''}</div>
      ${st.status==='done'||st.status==='partial'?`<div class="field"><span class="lab">实际花了多久</span>${actualHTML(st.dur,st.actual,'ed-actual')}</div>`:''}
      ${st.status==='done'?`<div class="field"><span class="lab">完成得怎么样</span>${evalHTML(st.ev,'ed-ev')}<input class="inp" data-k="evNote" value="${esc(st.evNote)}" placeholder="评价 / 心得（可不填）" aria-label="评价"></div>`:''}
      ${goals.length?`<div class="field"><span class="lab">属于哪个周目标</span><div class="chips"><button class="chip" data-act="ed-goal" data-v="" aria-pressed="${!st.goalId}">不关联</button>${goals.map(g=>`<button class="chip" data-act="ed-goal" data-v="${g.id}" aria-pressed="${st.goalId===g.id}">${esc(g.title)}</button>`).join('')}</div></div>`:''}
      <div class="chips"><button class="chip" data-act="ed-adhoc" aria-pressed="${st.adhoc}">临时任务</button>${st.start!=null&&st.day!=='backlog'?`<button class="chip" data-act="ed-ripple" aria-pressed="${st.ripple}">保存时顺延后面冲突的任务</button>`:''}</div>
      <div class="field"><label for="edNote">备注</label><textarea id="edNote" class="inp" rows="2" data-k="note">${esc(st.note)}</textarea></div>
      ${t0.postponed?`<p class="tip">这项已经推迟过 ${t0.postponed} 次。</p>`:''}
      ${(()=>{const c=S.tasks.get(id)||t0;return (c.tracked||c.timerStart)?`<div class="field"><span class="lab">计时记录 · 共 ${fmtDur(Math.round(trackedMs(c)/60000))}</span><p class="tip" style="margin:0">${sessionsText(c)}</p><div class="chips"><button class="chip" data-act="ed-resettimer">清零计时</button></div></div>`:'';})()}
      <div id="sh-preview">${preview(st)}</div>`;},
    preview,
    foot:st=>`<button class="btn danger" data-act="ed-del">${st.confirmDel?'再点一次删除':'删除'}</button><button class="btn primary" data-act="ed-save">保存</button>`,
    input(el,st){const k=el.dataset.k;if(k==='title'||k==='note'||k==='evNote'||k==='output')st[k]=el.value;else if(k==='actual')st.actual=numOrNull(el.value);else if(k==='day'){if(el.value)st.day=el.value;}
      else if(k==='start')st.start=parseHM(el.value);else if(k==='durN'){const v=parseInt(el.value,10);if(v>0)st.dur=v;}},
    on:{
      'ed-day'(el,st){st.day=el.dataset.v;if(st.day==='backlog')st.start=null;},'ed-notime'(el,st){st.start=null;st.ripple=false;},
      'ed-dur'(el,st){st.dur=+el.dataset.v;},'ed-status'(el,st){st.status=el.dataset.v;},'ed-pct'(el,st){st.pct=+el.dataset.v;},
      'ed-goal'(el,st){st.goalId=el.dataset.v||null;},'ed-resettimer'(el,st){const c=S.tasks.get(id);if(c){Store.saveTask({...c,timerStart:null,tracked:0,sessions:[]});renderAll();toast('计时已清零');}},'ed-actual'(el,st){st.actual=+el.dataset.v;},'ed-ev'(el,st){st.ev=st.ev===el.dataset.v?null:el.dataset.v;},'ed-adhoc'(el,st){st.adhoc=!st.adhoc;},'ed-ripple'(el,st){st.ripple=!st.ripple;},
      'ed-save'(el,st){const title=st.title.trim();if(!title){toast('任务名称不能为空');return false;}
        const t=S.tasks.get(id);if(!t){Sheet.close();return false;}
        const day=st.day,start=day==='backlog'?null:st.start;
        const later=day!==t.day&&(day==='backlog'||(t.day!=='backlog'&&day>t.day));
        const nt={...t,title,output:st.output.trim(),day,start,dur:st.dur,status:st.status,pct:st.status==='partial'?st.pct:null,goalId:st.goalId||null,note:st.note.trim(),actual:(st.status==='done'||st.status==='partial')?st.actual:null,ev:st.status==='done'?st.ev:null,evNote:st.status==='done'?st.evNote.trim():'',adhoc:st.adhoc,postponed:(t.postponed||0)+(later&&st.status!=='done'?1:0)};
        const ch=st.ripple&&start!=null?planInsert(tasksOfDay(day).filter(x=>x.id!==id),nt):[];
        const snaps=snap([id,...ch.map(c=>c.id)]);Store.saveTask(nt);applyChanges(ch);Sheet.close();renderAll();
        toast(ch.length?`已保存，顺延了 ${ch.length} 项`:'已保存',{label:'撤销',fn:()=>restore(snaps)});return false;},
      'ed-del'(el,st){if(!st.confirmDel){st.confirmDel=true;return;}const snaps=snap([id]);Store.deleteTask(id);Sheet.close();renderAll();toast('已删除',{label:'撤销',fn:()=>restore(snaps)});return false;}
    }});}

/* weekly goals */
function openGoal(id){const g0=S.tasks.get(id);if(!g0)return;
  const st={title:g0.title,output:g0.output||'',week:g0.day,est:g0.est||null,status:g0.status,note:g0.note||'',confirmDel:false};
  Sheet.open({st,title:()=>'周目标',
    body:st=>{const linked=allTasks().filter(t=>t.goalId===id&&t.kind!=='goal').sort((a,b)=>(a.day<b.day?-1:1));
      return `<div class="field"><label for="glTitle">目标</label><div class="withmic"><input id="glTitle" class="inp" data-k="title" value="${esc(st.title)}">${micBtn('#glTitle')}</div></div>
      <div class="field"><label for="glOut">本周产出（周末要交出什么）</label><input id="glOut" class="inp" data-k="output" value="${esc(st.output)}" placeholder="比如：完整的第三章初稿"></div>
      <div class="field"><span class="lab">哪一周</span><div class="stepper"><button class="icon" data-act="gl-wk" data-v="-7" aria-label="上一周">${svg(P.left)}</button><b style="font-size:14px;min-width:9em">第${isoWeek(st.week)}周 · ${mdShort(st.week)}起</b><button class="icon" data-act="gl-wk" data-v="7" aria-label="下一周">${svg(P.right)}</button></div></div>
      <div class="field"><span class="lab">预计投入</span><div class="chips"><button class="chip" data-act="gl-est" data-v="" aria-pressed="${!st.est}">不设</button>${[1,2,4,6,8,10,15,20].map(h=>`<button class="chip" data-act="gl-est" data-v="${h}" aria-pressed="${st.est===h}">${h} 小时</button>`).join('')}</div></div>
      <div class="field"><span class="lab">状态</span><div class="seg"><button data-act="gl-st" data-v="todo" aria-pressed="${st.status!=='done'}">进行中</button><button class="ok" data-act="gl-st" data-v="done" aria-pressed="${st.status==='done'}">已完成</button></div></div>
      <div class="field"><label for="glNote">备注</label><textarea id="glNote" class="inp" rows="2" data-k="note">${esc(st.note)}</textarea></div>
      <div class="field"><span class="lab">已安排的任务 · ${linked.length}</span>${linked.length?`<div class="preview">${linked.map(t=>`<div class="pv-row"><span class="pv-t">${esc(t.title)}</span><span class="pv-when">${t.day==='backlog'?'待安排':mdShort(t.day)} · ${{done:'完成',partial:'部分',skipped:'放弃'}[t.status]||'待办'}</span></div>`).join('')}</div>`:'<p class="tip">还没有。点下面的「安排到某天」把这个目标拆成具体任务。</p>'}</div>`;},
    foot:st=>`<button class="btn danger" data-act="gl-del">${st.confirmDel?'再点一次删除':'删除'}</button><button class="btn" data-act="gl-plan">安排到某天</button><button class="btn primary" data-act="gl-save">保存</button>`,
    input(el,st){const k=el.dataset.k;if(k==='title'||k==='note'||k==='output')st[k]=el.value;},
    on:{
      'gl-wk'(el,st){st.week=addDays(st.week,+el.dataset.v);},'gl-est'(el,st){st.est=el.dataset.v?+el.dataset.v:null;},'gl-st'(el,st){st.status=el.dataset.v;},
      'gl-save'(el,st){const g=S.tasks.get(id);if(!g||!st.title.trim()){Sheet.close();return false;}Store.saveTask({...g,title:st.title.trim(),output:st.output.trim(),day:st.week,est:st.est,status:st.status,note:st.note.trim()});Sheet.close();renderAll();toast('已保存');return false;},
      'gl-plan'(el,st){const g=S.tasks.get(id);if(g&&st.title.trim()&&(st.title.trim()!==g.title||st.week!==g.day))Store.saveTask({...g,title:st.title.trim(),day:st.week});Sheet.close(true);openGoalPlan(id);return false;},
      'gl-del'(el,st){if(!st.confirmDel){st.confirmDel=true;return;}const snaps=snap([id]);Store.deleteTask(id);Sheet.close();renderAll();toast('已删除目标',{label:'撤销',fn:()=>restore(snaps)});return false;}
    }});}
function openGoalPlan(id){const g=S.tasks.get(id);if(!g)return;const w=g.day,td=today();
  const st={title:g.title,output:'',day:(td>=w&&td<=addDays(w,6))?td:w,start:null,dur:S.settings.defDur||60};
  Sheet.open({st,title:()=>'把目标安排到某天',
    body:st=>`<p class="tip">目标：${esc(g.title)}</p>
      <div class="field"><label for="gpTitle">这次具体做什么</label><input id="gpTitle" class="inp" data-k="title" value="${esc(st.title)}"></div>
      <div class="field"><label for="gpOut">这次的产出</label><input id="gpOut" class="inp" data-k="output" value="${esc(st.output)}" placeholder="比如：3.1 节写完"></div>
      <div class="field"><span class="lab">哪天</span><div class="chips">${[...Array(7)].map((_,i)=>{const x=addDays(w,i);return `<button class="chip" data-act="gp-day" data-v="${x}" aria-pressed="${st.day===x}">${WD[i+1]} ${pd(x).getDate()}</button>`;}).join('')}</div></div>
      <div class="field"><label for="gpStart">开始时间（可不填）</label><input id="gpStart" type="time" class="inp" data-k="start" value="${st.start!=null?fmtHM(st.start):''}"></div>
      <div class="field"><span class="lab">大概多久</span>${durChips(st.dur,'gp-dur')}</div>`,
    foot:()=>'<button class="btn" data-act="sh-close">取消</button><button class="btn primary" data-act="gp-ok">安排</button>',
    input(el,st){const k=el.dataset.k;if(k==='title'||k==='output')st[k]=el.value;else if(k==='start')st.start=parseHM(el.value);else if(k==='durN'){const v=parseInt(el.value,10);if(v>0)st.dur=v;}},
    on:{'gp-day'(el,st){st.day=el.dataset.v;},'gp-dur'(el,st){st.dur=+el.dataset.v;},
      'gp-ok'(el,st){const title=st.title.trim()||g.title;const t=newTask({title,output:st.output.trim(),day:st.day,start:st.start,dur:st.dur,goalId:id});Store.saveTask(t);Sheet.close();renderAll();
        toast(`已安排到${WD[dow(st.day)]} ${mdShort(st.day)}`,{label:'去看看',fn:()=>goDay(st.day)});return false;}}});}

/* actual time + evaluation */
const EVALS=[['great','很满意'],['ok','还可以'],['meh','不太满意']];
const EVAL_L=Object.fromEntries(EVALS);
const numOrNull=v=>{const n=parseInt(v,10);return n>0?n:null;};
function actualHTML(plan,actual,act,i){const di=i!=null?` data-i="${i}"`:'';const opts=[...new Set([plan||60,15,30,45,60,90,120,180])].sort((a,b)=>a-b);
  return `<div class="chips">${opts.map(m=>`<button class="chip" data-act="${act}"${di} data-v="${m}" aria-pressed="${actual===m}">${fmtDur(m)}${m===plan?' · 同计划':''}</button>`).join('')}<label class="durn"><input type="number" inputmode="numeric" min="1" step="5" class="inp"${di} data-k="actual" value="${actual??''}" placeholder="—" aria-label="实际用时（分钟）"><span>分钟</span></label></div>`;}
function evalHTML(ev,act,i){const di=i!=null?` data-i="${i}"`:'';return `<div class="chips">${EVALS.map(([v,l])=>`<button class="chip" data-act="${act}"${di} data-v="${v}" aria-pressed="${ev===v}">${l}</button>`).join('')}</div>`;}
function openDone(id){const t0=S.tasks.get(id);if(!t0)return;
  const st={actual:t0.actual??null,ev:t0.ev||null,evNote:t0.evNote||''};
  Sheet.open({st,title:()=>`完成：${esc(t0.title)}`,
    body:st=>`${t0.output?`<p class="sr-out" style="margin:0">计划产出：${esc(t0.output)}</p>`:''}<p class="tip">计划 ${fmtDur(t0.dur)}${t0.start!=null?` · ${fmtHM(t0.start)}–${fmtHM(t0.start+(t0.dur||0))}`:''}${t0.tracked?` · 计时 ${fmtDur(Math.round(t0.tracked/60000))}`:''}</p>${t0.sessions&&t0.sessions.length?`<p class="tip" style="margin-top:-8px">${sessionsText(t0)}</p>`:''}
      <div class="field"><span class="lab">实际花了多久</span>${actualHTML(t0.dur,st.actual,'dn-actual')}</div>
      <div class="field"><span class="lab">完成得怎么样</span>${evalHTML(st.ev,'dn-ev')}</div>
      <div class="field"><label for="dnNote">评价 / 心得</label><div class="withmic"><textarea id="dnNote" class="inp" rows="2" data-k="evNote" placeholder="比如：比预想难，下次多留点时间">${esc(st.evNote)}</textarea>${micBtn('#dnNote')}</div></div>`,
    foot:()=>'<button class="btn" data-act="sh-close">跳过</button><button class="btn primary" data-act="dn-save">保存</button>',
    input(el,st){const k=el.dataset.k;if(k==='actual')st.actual=numOrNull(el.value);else if(k==='evNote')st.evNote=el.value;},
    on:{'dn-actual'(el,st){st.actual=+el.dataset.v;},'dn-ev'(el,st){st.ev=st.ev===el.dataset.v?null:el.dataset.v;},
      'dn-save'(el,st){const t=S.tasks.get(id);if(t)Store.saveTask({...t,actual:st.actual,ev:st.ev,evNote:st.evNote.trim()});Sheet.close();renderAll();toast('已记录');return false;}}});}

/* end-of-day summary */
function sumStats(rows){let n=rows.length,done=0,part=0,miss=0,plan=0,doneMin=0,score=0,adhoc=0,actMin=0,actPlan=0;
  for(const r of rows){plan+=r.dur||0;if(r.adhoc)adhoc++;const hasA=r.actual!=null;
    if(r.status==='done'){done++;doneMin+=hasA?r.actual:(r.dur||0);score+=1;if(hasA){actMin+=r.actual;actPlan+=r.dur||0;}}
    else if(r.status==='partial'){part++;doneMin+=hasA?r.actual:(r.dur||0)*r.pct/100;score+=r.pct/100;}else miss++;}
  return {n,done,part,miss,plan,doneMin:Math.round(doneMin),rate:n?score/n:0,adhoc,actMin,actPlan};}
function openSummary(d){
  const sum=S.sums.get(d);const rows=[];const seen=new Set();
  if(sum&&sum.items){for(const [id,it] of Object.entries(sum.items)){const t=S.tasks.get(id);
    rows.push({id,title:it.title,start:it.start??null,dur:it.dur||0,status:it.status||'missed',reasons:[...(it.reasons||[])],note:it.note||'',pct:it.pct||50,follow:it.follow||'keep',locked:!t||t.day!==d,nowDay:t?t.day:null,adhoc:!!it.adhoc,output:it.output||'',actual:it.actual??null,ev:it.ev||null,evNote:it.evNote||''});seen.add(id);}}
  for(const t of tasksOfDay(d)){if(seen.has(t.id))continue;const status=t.status==='done'?'done':t.status==='partial'?'partial':'missed';
    rows.push({id:t.id,title:t.title,start:t.start,dur:t.dur||0,status,reasons:[],note:'',pct:t.pct||50,follow:status==='done'?'keep':(t.status==='skipped'?'drop':'tomorrow'),locked:false,adhoc:!!t.adhoc,output:t.output||'',actual:t.actual??null,ev:t.ev||null,evNote:t.evNote||''});}
  rows.sort((a,b)=>(a.start??1e9)-(b.start??1e9));
  const st={d,rows,rating:sum?.rating||0,reflect:sum?.reflect||'',focus:sum?.focus||'',focusId:sum?.focusId||null,reasons:[...(S.settings.reasons||DEFAULT_REASONS)],newReason:''};
  const row=(r,i)=>{let h=`<div class="srow"><div class="sr-top"><span class="sr-time">${r.start!=null?fmtHM(r.start):'—'}</span><span class="sr-title">${esc(r.title)}${r.adhoc?' <span class="tag adhoc">临时</span>':''}</span><span class="dur">${fmtDur(r.dur)}</span></div>
      ${r.output?`<div class="sr-out">计划产出：${esc(r.output)}</div>`:''}
      <div class="seg sm">${[['done','完成','ok'],['partial','部分','warn'],['missed','没做','bad']].map(([v,l,c])=>`<button class="${c}" data-act="sm-status" data-i="${i}" data-v="${v}" aria-pressed="${r.status===v}">${l}</button>`).join('')}</div>`;
    if(r.status==='partial')h+=`<div class="chips">${[25,50,75].map(p=>`<button class="chip" data-act="sm-pct" data-i="${i}" data-v="${p}" aria-pressed="${r.pct===p}">完成约 ${p}%</button>`).join('')}</div>`;
    if(r.status!=='missed')h+=`<div class="sr-sub">实际用时</div>${actualHTML(r.dur,r.actual,'sm-actual',i)}`;
    if(r.status==='done')h+=`<div class="sr-sub">完成得怎么样</div>${evalHTML(r.ev,'sm-ev',i)}<input class="inp" data-i="${i}" data-k="evNote" value="${esc(r.evNote)}" placeholder="评价 / 心得（可不填）" aria-label="评价">`;
    if(r.status!=='done'){
      h+=`<div class="sr-sub">没做完的原因（可多选）</div><div class="chips">${st.reasons.map(x=>`<button class="chip" data-act="sm-reason" data-i="${i}" data-v="${esc(x)}" aria-pressed="${r.reasons.includes(x)}">${esc(x)}</button>`).join('')}<button class="chip ghost" data-act="sm-addr" data-i="${i}">+ 其他原因</button></div>`;
      if(r.addOpen)h+=`<div class="inline-add"><input id="nr${i}" class="inp" data-i="${i}" data-k="newReason" placeholder="写下原因，会加入选项"><button class="chip" data-act="sm-addr-ok" data-i="${i}">添加</button></div>`;
      h+=`<input class="inp" data-i="${i}" data-k="note" value="${esc(r.note)}" placeholder="补充说明（可不填）" aria-label="补充说明">`;
      if(r.locked)h+=`<div class="sr-sub">${r.nowDay?`已移到 ${r.nowDay==='backlog'?'待安排':mdLabel(r.nowDay)}`:'这项任务已删除'}</div>`;
      else h+=`<div class="sr-sub">剩下的怎么处理</div><div class="chips">${[['tomorrow','移到明天'],['backlog','放进待安排'],['keep','留在这天'],['drop','不做了']].map(([v,l])=>`<button class="chip" data-act="sm-follow" data-i="${i}" data-v="${v}" aria-pressed="${r.follow===v}">${l}</button>`).join('')}</div>`;}
    return h+'</div>';};
  Sheet.open({st,
    title:st=>`日终总结 · ${mdLabel(st.d)} ${WD[dow(st.d)]}`,
    body:st=>{const s=sumStats(st.rows);
      let h=`<div class="sumhead"><div><b>${s.done}</b><span>完成</span></div><div><b>${s.part}</b><span>部分</span></div><div><b>${s.miss}</b><span>没做</span></div><div><b>${Math.round(s.rate*100)}%</b><span>完成率</span></div></div>`;
      if(s.actPlan){const df=s.actMin-s.actPlan;h+=`<p class="tip">已记录用时的完成任务：计划 ${fmtDur(s.actPlan)}，实际 ${fmtDur(s.actMin)}${df?`（${df>0?'多':'少'}用 ${fmtDur(Math.abs(df))}）`:'，和计划一致'}</p>`;}
      if(!st.rows.length)h+='<p class="tip">这天没有任务，也可以只记一下感受。</p>';
      h+=st.rows.map(row).join('');
      h+=`<div class="field"><span class="lab">今天整体感觉</span><div class="chips">${RATING.map((l,n)=>`<button class="chip" data-act="sm-rate" data-v="${n+1}" aria-pressed="${st.rating===n+1}">${l}</button>`).join('')}</div></div>
      <div class="field"><label for="smReflect">一句话总结 / 反思</label><div class="withmic"><textarea id="smReflect" class="inp" rows="3" data-k="reflect" placeholder="做得好的、卡住的、明天想怎么调整">${esc(st.reflect)}</textarea>${micBtn('#smReflect')}</div></div>
      <div class="field"><label for="smFocus">${addDays(st.d,1)===today()?'今天':'明天'}最重要的一件事</label><input id="smFocus" class="inp" data-k="focus" value="${esc(st.focus)}" placeholder="写下来会自动加到第二天的任务里"></div>`;
      return h;},
    foot:()=>'<button class="btn" data-act="sh-close">稍后再写</button><button class="btn primary" data-act="sm-save">保存总结</button>',
    input(el,st){const k=el.dataset.k;if(k==='reflect'||k==='focus'||k==='newReason')st[k]=el.value;else if(k==='note'||k==='evNote'||k==='actual'){const r=st.rows[+el.dataset.i];if(r){if(k==='actual')r.actual=numOrNull(el.value);else r[k]=el.value;}}},
    on:{
      'sm-status'(el,st){const r=st.rows[+el.dataset.i];r.status=el.dataset.v;if(r.status!=='done'&&r.follow==='keep'&&!r.locked)r.follow='tomorrow';if(r.status==='done')r.follow='keep';},
      'sm-pct'(el,st){st.rows[+el.dataset.i].pct=+el.dataset.v;},'sm-actual'(el,st){st.rows[+el.dataset.i].actual=+el.dataset.v;},'sm-ev'(el,st){const r=st.rows[+el.dataset.i];r.ev=r.ev===el.dataset.v?null:el.dataset.v;},
      'sm-reason'(el,st){const r=st.rows[+el.dataset.i],v=el.dataset.v;const k=r.reasons.indexOf(v);k<0?r.reasons.push(v):r.reasons.splice(k,1);},
      'sm-follow'(el,st){st.rows[+el.dataset.i].follow=el.dataset.v;},
      'sm-rate'(el,st){const v=+el.dataset.v;st.rating=st.rating===v?0:v;},
      'sm-addr'(el,st){const i=+el.dataset.i;st.rows[i].addOpen=true;st.newReason='';setTimeout(()=>$('#nr'+i)?.focus(),30);},
      'sm-addr-ok'(el,st){const i=+el.dataset.i;const v=st.newReason.trim();if(v){if(!st.reasons.includes(v)){st.reasons.push(v);Store.saveSettings({...S.settings,reasons:[...st.reasons]});}if(!st.rows[i].reasons.includes(v))st.rows[i].reasons.push(v);}st.rows[i].addOpen=false;st.newReason='';},
      'sm-save'(el,st){const d=st.d;const items={};let moved=0;const touched=[];
        for(const r of st.rows){const t=S.tasks.get(r.id);let follow=r.status==='done'?'keep':r.follow;
          if(t&&!r.locked){const u={...t};
            u.status=r.status==='done'?'done':r.status==='partial'?'partial':'todo';u.pct=r.status==='partial'?r.pct:null;u.actual=r.status!=='missed'?r.actual:null;u.ev=r.status==='done'?r.ev:null;u.evNote=r.status==='done'?(r.evNote||'').trim():'';
            if(r.status!=='done'){
              if(follow==='tomorrow'){u.day=addDays(d,1);u.start=null;u.status='todo';u.pct=null;u.actual=null;u.postponed=(t.postponed||0)+1;moved++;}
              else if(follow==='backlog'){u.day='backlog';u.start=null;u.status='todo';u.pct=null;u.actual=null;u.postponed=(t.postponed||0)+1;moved++;}
              else if(follow==='drop')u.status='skipped';}
            if(u.status!==t.status||u.day!==t.day||u.pct!==t.pct||u.actual!==(t.actual??null)||u.ev!==(t.ev??null)||u.evNote!==(t.evNote||'')){touched.push({...t});Store.saveTask(u);}}
          else if(r.locked){const prev=sum&&sum.items&&sum.items[r.id];follow=prev?prev.follow:follow;}
          items[r.id]={title:r.title,output:r.output||'',start:r.start,dur:r.dur,status:r.status,actual:r.status!=='missed'?r.actual:null,ev:r.status==='done'?r.ev:null,evNote:r.status==='done'?(r.evNote||'').trim():'',pct:r.status==='partial'?r.pct:null,reasons:r.status==='done'?[]:r.reasons,note:r.status==='done'?'':r.note.trim(),follow,adhoc:r.adhoc};}
        let focusId=st.focusId;const f=st.focus.trim();
        if(f&&!(focusId&&S.tasks.get(focusId))){const ft=newTask({title:f,day:addDays(d,1),focus:true});Store.saveTask(ft);focusId=ft.id;}
        else if(f&&focusId){const ft=S.tasks.get(focusId);if(ft&&ft.title!==f)Store.saveTask({...ft,title:f});}
        const ss=sumStats(st.rows);
        Store.saveSum({date:d,items,rating:st.rating,reflect:st.reflect.trim(),focus:f,focusId:focusId||null,stats:ss,saved:Date.now()});
        Sheet.close();renderAll();toast(`总结已保存${moved?`，${moved} 项已移出这天`:''}`);return false;}
    }});
}

/* ---------- navigation + actions ---------- */
function goDay(d){S.tab='day';S.day=d;S.sel=null;S.scope='day';Store.ensure(d);renderAll();window.scrollTo({top:0});}
function goWeek(w){S.week=w;Store.ensure(w);renderAll();window.scrollTo({top:0});}
function setTab(t){if(t===S.tab)return;
  if(t==='week')S.week=monday(S.day);
  if(t==='day'&&S.tab==='week'&&!(S.day>=S.week&&S.day<=addDays(S.week,6))){const td=today();S.day=(td>=S.week&&td<=addDays(S.week,6))?td:S.week;}
  S.tab=t;S.sel=null;S.scope=t==='week'?'goal':'day';renderAll();window.scrollTo({top:0});}
const taskOf=el=>{const r=el.closest('[data-id]');return r?S.tasks.get(r.dataset.id):null;};
function loadSamples(){const d=S.day;
  const ex=[['回复邮件和消息',540,30],['写作：方法部分',570,120],['午饭，散步',720,60],['组会',840,60],['整理实验数据',930,90],['读一篇文献',null,45]];
  const created=ex.map(([title,start,dur])=>Store.saveTask(newTask({title,day:d,start,dur})));
  renderAll();toast('放了 6 条示例任务，可以随便改或删',{label:'撤销',fn:()=>restore([],created.map(t=>t.id))},6000);}
const ACT={
  'day-prev':()=>goDay(addDays(S.day,-1)),'day-next':()=>goDay(addDays(S.day,1)),'day-today':()=>goDay(today()),'day-pick':el=>goDay(el.dataset.d),
  'week-prev':()=>goWeek(addDays(S.week,-7)),'week-next':()=>goWeek(addDays(S.week,7)),'week-today':()=>goWeek(monday(today())),
  'open-day':el=>goDay(el.dataset.d),
  'toggle':el=>{let t=taskOf(el);if(!t)return;const done=t.status!=='done';if(done&&t.timerStart)t=pauseTimer(t);Store.saveTask({...t,status:done?'done':'todo'});renderAll();if(done)toast(t.tracked?`已完成「${t.title}」，计时 ${fmtDur(Math.round(t.tracked/60000))}`:`已完成「${t.title}」`,{label:t.tracked?'写评价':'记录用时和评价',fn:()=>openDone(t.id)},7000);},
  'timer-toggle':el=>{const t=taskOf(el);if(!t)return;if(t.timerStart){const u=pauseTimer(t);renderAll();toast(`已暂停，累计 ${fmtDur(Math.round(u.tracked/60000))}`);}else startTimer(t.id);},
  'timer-pause':el=>{const t=taskOf(el);if(!t)return;const u=pauseTimer(t);renderAll();toast(`已暂停「${t.title}」，累计 ${fmtDur(Math.round(u.tracked/60000))}`);},
  'timer-finish':el=>{const t=taskOf(el);if(t)finishTimer(t.id);},

  'more':el=>{const t=taskOf(el);if(t)openMore(t.id);},
  'sel-toggle':el=>{const t=taskOf(el);if(!t||!S.sel)return;S.sel.has(t.id)?S.sel.delete(t.id):S.sel.add(t.id);renderAll();},
  'sel-start':()=>{S.sel=new Set();renderAll();},'sel-cancel':()=>{S.sel=null;renderAll();},'sel-none':()=>{S.sel=new Set();renderAll();},
  'sel-rest':()=>{S.sel=new Set(tasksOfDay(S.day).filter(isActive).map(t=>t.id));renderAll();},
  'sel-shift':()=>{if(S.sel&&S.sel.size)openShift([...S.sel]);},
  'insert':()=>openInsert(S.day),'summary':el=>openSummary(el.dataset.d||S.day),'settings':()=>openSettings(),
  'gap-add':el=>{const s=+el.dataset.s,e=+el.dataset.e;openConfirm([{title:'',kind:'task',day:S.day,start:s,dur:Math.min(e-s,S.settings.defDur||60),durSet:true}]);},
  'goal-toggle':el=>{const g=taskOf(el);if(g){Store.saveTask({...g,status:g.status==='done'?'todo':'done'});renderAll();}},
  'goal-edit':el=>{const g=taskOf(el);if(g)openGoal(g.id);},'goal-plan':el=>{const g=taskOf(el);if(g)openGoalPlan(g.id);},
  'bl-plan':el=>{const t=taskOf(el);if(t)openShift([t.id],'date');},
  'day-shift':el=>{const ids=tasksOfDay(el.dataset.d).filter(isActive).map(t=>t.id);if(ids.length)openShift(ids,'days',{later:true});},
  'ex-fill':el=>{const i=$('#addInput');i.value=el.dataset.text;i.focus();updateHint();},
  'load-samples':()=>loadSamples(),
  'scope':()=>{const o=['day','goal','backlog'];S.scope=o[(o.indexOf(S.scope)+1)%3];updateHint();},
  'sync-now':()=>{if(Store.mode==='cloud'){Store.sync().then(()=>{if(Store.err)toast('同步出错：'+Store.err);});}else if(Store.mode==='local')openSettings();},
  'auth-local':()=>{Store.useLocal();},
  'toast-act':()=>{const f=toastFn;toastFn=null;$('#toast').classList.remove('show');if(f)f();},
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act],[data-tab]');if(!el||el.disabled)return;
  if(el.dataset.tab){setTab(el.dataset.tab);return;}
  const act=el.dataset.act;
  if(act==='mic'){e.preventDefault();Mic.click(el);return;}
  if(act==='toast-act'){ACT[act]();return;}
  if(el.closest('#sheet-root')){Sheet.handle(el,e);return;}
  const f=ACT[act];if(f){e.preventDefault();f(el,e);}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&Sheet.cur){Sheet.close();return;}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role="button"][data-act]')){e.preventDefault();e.target.click();}
});
document.addEventListener('input',e=>{const el=e.target;
  if(el.id==='addInput'){updateHint();return;}
  if(Sheet.cur&&el.closest&&el.closest('#sheet')&&Sheet.cur.input){Sheet.cur.input(el,Sheet.cur.st);Sheet.refresh();}
});
$('#addForm').addEventListener('submit',e=>{e.preventDefault();submitAdd(false);});
document.addEventListener('submit',e=>{if(e.target&&e.target.id==='authForm'){e.preventDefault();doSignIn();}});
$('#btnSettings').innerHTML=svg(P.sliders);$('#addSend').innerHTML=svg(P.send,2.2);$('#addMic').innerHTML=svg(P.mic);
let lastToday=today();
setInterval(()=>{const td=today();if(td!==lastToday){if(S.day===lastToday)S.day=td;lastToday=td;}if(!document.hidden&&S.tab==='day'&&S.loaded&&!Sheet.cur&&Store.mode!=='auth')renderAll();},60000);
renderAll();Store.init();Mic.init();
if('serviceWorker' in navigator&&location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
